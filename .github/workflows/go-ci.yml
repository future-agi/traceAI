name: Go CI

on:
  pull_request:
    paths:
      - 'go/**'
      # go/auto embeds byte-identical copies of the shared privacy catalogs.
      - 'spec/auto-instrumentation/**'
      - '.github/workflows/go-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'go/**'
      - 'spec/auto-instrumentation/**'
      - '.github/workflows/go-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }} / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [a2a, anthropic, auto, bedrock, eino, genai, lambda, langchaingo, openai]
        go: ['1.26.0', stable]
    defaults:
      run:
        working-directory: go/${{ matrix.module }}
    env:
      # Test each independently consumable module, not a developer's workspace.
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/${{ matrix.module }}/go.sum
      - name: Check module identity and release portability
        env:
          MODULE: ${{ matrix.module }}
        run: |
          go mod edit -json | python3 -c '
          import json, os, sys
          mod = json.load(sys.stdin)
          assert mod["Module"]["Path"] == "github.com/future-agi/traceAI/go/" + os.environ["MODULE"]
          assert mod["Go"] == "1.26.0"
          assert not any(not r["New"].get("Version") for r in mod.get("Replace") or []), "local replace is not releasable"
          '
      - name: Check tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Build example
        run: go build -o "$RUNNER_TEMP/traceai-example" ./example
      - name: Render package documentation
        run: go doc .

  auto-sdk-compatibility:
    name: auto / real OpenAI and Anthropic SDK clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # A separate, unpublished test module, so go/auto never requires either SDK.
        working-directory: go/auto/sdkcompat
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/auto/sdkcompat/go.sum
      - name: Vet and race tests through the SDK default clients
        run: |
          go vet ./...
          go test -race -count=1 ./...

  eino-auto-import:
    name: eino/auto / one-import Eino tracing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # A separate module: go/auto and go/eino never require each other. It
        # resolves both from this working tree until they are released.
        working-directory: go/eino/auto
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/eino/auto/go.sum
      - name: Check module identity and in-repo replaces
        # Unlike the matrix modules this one is developed against the working
        # tree of go/auto and go/eino, so it carries exactly those two replaces.
        # The release gate (.github/release/release_plan.py --go-gate) refuses
        # to tag it while they, or requirements older than the first release
        # with the APIs it uses, remain.
        run: |
          go mod edit -json | python3 -c '
          import json, sys
          mod = json.load(sys.stdin)
          assert mod["Module"]["Path"] == "github.com/future-agi/traceAI/go/eino/auto"
          assert mod["Go"] == "1.26.0"
          replaces = {r["Old"]["Path"]: r["New"]["Path"] for r in mod.get("Replace") or []}
          assert replaces == {"github.com/future-agi/traceAI/go/auto": "../../auto", "github.com/future-agi/traceAI/go/eino": "../"}, replaces
          '
      - name: Report the release gate
        run: python3 "$GITHUB_WORKSPACE/.github/release/release_plan.py" --root "$GITHUB_WORKSPACE" --go-gate go/eino/auto || echo "not taggable yet (expected until go/auto and go/eino are released)"
      - name: Check tidy
        run: go mod tidy -diff
      - name: Vet and race tests through the blank import
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: A program that imports only go/auto downloads no Eino
        run: |
          dir="$RUNNER_TEMP/auto-only"
          mkdir -p "$dir"
          cd "$dir"
          printf 'package main\n\nimport _ "github.com/future-agi/traceAI/go/auto"\n\nfunc main() {}\n' > main.go
          go mod init example.com/auto-only
          go mod edit -require=github.com/future-agi/traceAI/go/auto@v0.0.0 -replace=github.com/future-agi/traceAI/go/auto="$GITHUB_WORKSPACE/go/auto"
          go mod tidy
          if go list -m all | grep -qi cloudwego; then echo "go/auto requires cloudwego"; exit 1; fi
          if grep -qi cloudwego go.sum; then echo "go.sum names cloudwego"; exit 1; fi

  auto-opentelemetry-latest:
    name: auto / span limits on the latest OpenTelemetry SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go/auto
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/auto/go.sum
      # An application's build may select a newer SDK than go/auto requires. The
      # agent reads span limits from the SDK's configuration, so these
      # regressions fail when a newer SDK changes that layout.
      - name: Select the latest OpenTelemetry API and SDK
        run: |
          go get go.opentelemetry.io/otel@latest go.opentelemetry.io/otel/sdk@latest
          go mod tidy
          go list -m go.opentelemetry.io/otel go.opentelemetry.io/otel/sdk
      - name: Span-limit regressions
        run: |
          set -o pipefail
          tests='TestProviderValueLengthAdapter TestSmallHostAttributeLimitsOTLP TestCountLimitEvictedHintOTLP TestValueLengthTruncatedHintOTLP TestWireSpanValueLengthOTLP TestZeroCodeSpanLimitsE2E TestSpanLimitsWarningNamesTheSDK'
          go test -race -count=1 -v -run "^($(echo $tests | tr ' ' '|'))\$" . | tee "$RUNNER_TEMP/span-limits.log"
          for name in $tests; do
            grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/span-limits.log" || { echo "$name did not run and pass"; exit 1; }
          done

  genai-sdk-compatibility:
    name: genai / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['v1.71.0', 'v1.77.0']
    defaults:
      run:
        working-directory: go/genai
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/genai/go.sum
      - name: Select SDK version
        run: go get google.golang.org/genai@${{ matrix.sdk }}
      - name: Test real SDK transport and OTLP export
        run: go test -race -count=1 ./...

  bedrock-current:
    name: bedrock / current AWS / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.0', stable]
    defaults:
      run:
        working-directory: go/bedrock
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/bedrock/go.sum
      - name: Resolve current AWS SDK without changing the declared floor
        run: |
          go get github.com/aws/aws-sdk-go-v2/service/bedrockruntime@v1.63.9 github.com/aws/smithy-go/tracing/smithyoteltracing@v1.0.35
          test "$(go list -m -f '{{.Version}}' github.com/aws/aws-sdk-go-v2/service/bedrockruntime)" = v1.63.9
      - name: Vet and race tests including OTLP example
        run: |
          go vet ./...
          go test -race -count=1 ./...

  langchaingo-compatibility:
    name: langchaingo / ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['v0.1.15', latest]
    defaults:
      run:
        working-directory: go/langchaingo
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/langchaingo/go.sum
      - name: Select LangChainGo version
        run: go get github.com/tmc/langchaingo@${{ matrix.sdk }}
      - name: Test callbacks and embedding wrapper
        run: go test -race -count=1 ./...
