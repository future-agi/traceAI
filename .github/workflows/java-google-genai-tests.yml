name: Java Google GenAI compatibility

on:
  pull_request:
    paths:
      - 'java/traceai-java-google-genai/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/java-google-genai-tests.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/traceai-java-google-genai/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/java-google-genai-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        genai: ['1.1.0', '1.80.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Prepare dependencies without executing tests
        run: |
          mvn -B -ntp -f java/pom.xml -pl traceai-java-google-genai -am \
            -Dgoogle-genai.version=${{ matrix.genai }} -DskipTests package dependency:go-offline
          mvn -B -ntp -f java/pom.xml dependency:get \
            -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.2.3
          mvn -B -ntp -f java/pom.xml dependency:get \
            -Dartifact=org.junit.platform:junit-platform-launcher:1.10.1
      - name: Test with loopback as the only network interface
        run: |
          sudo --preserve-env=JAVA_HOME,PATH unshare --net bash -c '
            ip link set lo up
            mvn -o -B -ntp -Dmaven.repo.local="'"$HOME"'/.m2/repository" \
              -f java/pom.xml -pl traceai-java-google-genai -am \
              -Dgoogle-genai.version=${{ matrix.genai }} \
              -Dtest=TracedGenerativeModelTest -Dsurefire.failIfNoSpecifiedTests=false test
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-genai-java-${{ matrix.genai }}
          path: java/traceai-java-google-genai/target/surefire-reports/
