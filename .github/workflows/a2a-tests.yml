name: A2A native adapter

on:
  pull_request:
    branches: [dev, main]
    paths:
      - python/frameworks/a2a/**
      - .github/workflows/a2a-tests.yml
  push:
    branches: [dev, main]
    paths:
      - python/frameworks/a2a/**
      - .github/workflows/a2a-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: A2A SDK ${{ matrix.sdk }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: "0.2.4"
            python: "3.10"
          - sdk: "0.3.26"
            python: "3.11"
          - sdk: "1.3.0"
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install ./python/frameworks/a2a "a2a-sdk[grpc]==${{ matrix.sdk }}" pytest pytest-asyncio pytest-socket opentelemetry-exporter-otlp-proto-http
      - name: Test synthetic SDK calls and localhost OTLP export
        run: |
          python -m pytest python/frameworks/a2a/tests -q -o addopts='' -o asyncio_default_fixture_loop_scope=function --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1
