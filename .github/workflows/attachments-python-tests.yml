name: Python attachments

on:
  pull_request:
    paths:
      - 'python/fi_instrumentation/**'
      - 'python/traceai/**'
      - 'python/tests/attachments/**'
      - '.github/workflows/attachments-python-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/fi_instrumentation/**'
      - 'python/traceai/**'
      - 'python/tests/attachments/**'
      - '.github/workflows/attachments-python-tests.yml'

permissions:
  contents: read

jobs:
  component:
    name: Attachments Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python }}'
      - name: Install component dependencies
        run: python -m pip install -e python 'pytest>=7,<8' 'pytest-asyncio>=0.21,<0.22' pytest-mock responses
      - name: Run synthetic attachment, lifecycle exit-probe and auto tests
        env:
          PYTHONPATH: python
          FI_BASE_URL: http://127.0.0.1:9
          FI_GRPC_URL: http://127.0.0.1:9
        # faulthandler dumps every thread's stack if a test stalls, so a hang
        # is diagnosable from the log instead of only timing out the job.
        run: python -m pytest -q -p no:cacheprovider -o faulthandler_timeout=120 python/tests/attachments python/traceai/tests
