name: Java SDK CI

on:
  pull_request:
    paths:
      - 'java/**'
      - 'jitpack.yml'
      - '.github/workflows/java-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/**'
      - 'jitpack.yml'
      - '.github/workflows/java-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-lifecycle:
    name: Core lifecycle (Java ${{ matrix.java }}, OTel ${{ matrix.otel }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        otel: ['1.35.0', '1.67.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Test core ownership and localhost OTLP export
        run: mvn -B -ntp -f java/pom.xml -pl traceai-java-core -am -Dopentelemetry.version=${{ matrix.otel }} test
      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-lifecycle-java-${{ matrix.java }}-otel-${{ matrix.otel }}
          path: java/traceai-java-core/target/surefire-reports/
          if-no-files-found: warn

  spring-boot-starter:
    name: Spring Boot starter (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - boot: '3.2.1'
            profile: ''
          - boot: '3.5.16'
            profile: ''
          - boot: '4.1.2'
            profile: '-Dboot4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Install core and starter
        run: mvn -B -ntp -f java/pom.xml -pl traceai-spring-boot-starter -am -DskipTests install
      - name: Test the installed starter with Boot's BOM and native tracing
        run: mvn -B -ntp -f java/compatibility/spring-boot/pom.xml -Dspring-boot.version=${{ matrix.boot }} ${{ matrix.profile }} test
      - name: Upload starter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-starter-${{ matrix.boot }}
          path: java/compatibility/spring-boot/target/surefire-reports/
          if-no-files-found: warn

  verify:
    name: Build, test, and validate Central artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test the complete reactor
        run: mvn -B -ntp verify
      - name: Build sources and Javadocs without signing or publishing
        run: mvn -B -ntp -P release -Dgpg.skip package
      - name: Generate effective POMs
        run: mvn -B -ntp -P release help:effective-pom -Doutput=target/central-effective-pom.xml
      - name: Check Central metadata and version alignment
        run: python3 -I scripts/check_central.py --artifacts
      - name: Compile external Central-coordinate consumers and the OpenAI example
        run: |
          mvn -B -ntp -DskipTests install
          python3 -I scripts/test_consumers.py
          mvn -B -ntp -f examples/openai-example/pom.xml test
      - name: Validate self-contained JitPack POMs and external consumers
        run: |
          ./mvnw -B -ntp -P jitpack -DskipTests install
          python3 -I scripts/test_consumers.py --check-jitpack-poms
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: java/**/target/surefire-reports/
          if-no-files-found: warn
