name: Java SDK CI

on:
  pull_request:
    paths:
      - 'java/**'
      - 'jitpack.yml'
      - '.github/workflows/java-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/**'
      - 'jitpack.yml'
      - '.github/workflows/java-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google-adk:
    name: Native Google ADK ${{ matrix.adk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        adk: ['1.12.0', '1.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Read the reactor version
        run: |
          echo "TRACEAI_VERSION=$(python3 -I -c 'import xml.etree.ElementTree as E; print(E.parse("java/pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')" >> "$GITHUB_ENV"
      - name: Install core and resolve contract dependencies
        run: |
          mvn -B -ntp -f java/pom.xml -pl traceai-java-core -am -DskipTests install
          mvn -B -ntp -f java/compatibility/google-adk/pom.xml -Dtraceai.version="$TRACEAI_VERSION" -Dadk.version=${{ matrix.adk }} -DskipTests test dependency:go-offline
          mvn -B -ntp -f java/compatibility/google-adk/pom.xml dependency:get -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.5.2
          mvn -B -ntp -f java/compatibility/google-adk/pom.xml dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.11.4
          # Surefire resolves its provider's older commons artifact dynamically, even with JUnit 5.11.
          mvn -B -ntp -f java/compatibility/google-adk/pom.xml dependency:get -Dartifact=org.junit.platform:junit-platform-commons:1.9.3
      - name: Test native tracing with only loopback networking
        run: |
          sudo unshare --net bash -c '
            ip link set lo up
            export HOME="$1" JAVA_HOME="$4"
            "$2" -o -B -ntp -Dmaven.repo.local="$1/.m2/repository" -f java/compatibility/google-adk/pom.xml -Dtraceai.version="$5" -Dadk.version="$3" -Dtest=AdkPrivateTest,AdkContentTest,AdkPropagationTest test
            first=$?
            ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS=false "$2" -o -B -ntp -Dmaven.repo.local="$1/.m2/repository" -f java/compatibility/google-adk/pom.xml -Dtraceai.version="$5" -Dadk.version="$3" -Dtest=AdkSourceContentOffTest test
            second=$?
            test "$first" -eq 0 && test "$second" -eq 0
          ' bash "$HOME" "$(command -v mvn)" '${{ matrix.adk }}' "$JAVA_HOME" "$TRACEAI_VERSION"
      - name: Upload ADK contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-adk-${{ matrix.adk }}-reports
          path: java/compatibility/google-adk/target/surefire-reports/
          if-no-files-found: warn

  verify:
    name: Build, test, and validate Central artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test the complete reactor
        run: mvn -B -ntp verify
      - name: Build sources and Javadocs without signing or publishing
        run: mvn -B -ntp -P release -Dgpg.skip package
      - name: Generate effective POMs
        run: mvn -B -ntp -P release help:effective-pom -Doutput=target/central-effective-pom.xml
      - name: Check Central metadata and version alignment
        run: python3 -I scripts/check_central.py --artifacts
      - name: Compile external Central-coordinate consumers and the OpenAI example
        run: |
          mvn -B -ntp -DskipTests install
          python3 -I scripts/test_consumers.py
          mvn -B -ntp -f examples/openai-example/pom.xml test
      - name: Validate self-contained JitPack POMs and external consumers
        run: |
          ./mvnw -B -ntp -P jitpack -DskipTests install
          python3 -I scripts/test_consumers.py --check-jitpack-poms
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: java/**/target/surefire-reports/
          if-no-files-found: warn
