name: Java SDK CI

on:
  pull_request:
    paths:
      - 'java/**'
      - 'jitpack.yml'
      - '.github/workflows/java-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/**'
      - 'jitpack.yml'
      - '.github/workflows/java-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgvector:
    name: pgvector (Java ${{ matrix.java }}, JDBC ${{ matrix.jdbc }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        jdbc: ['42.7.1', '42.7.14']
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pgvector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgvector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Prepare offline dependencies
        run: |
          mvn -B -ntp -pl traceai-java-pgvector -am -Dpostgresql.version=${{ matrix.jdbc }} -DskipTests dependency:go-offline test
          mvn -B -ntp dependency:get -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.2.3
          mvn -B -ntp dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.10.1
      - name: Test nonempty database results and OTLP export
        run: >-
          mvn -o -B -ntp -pl traceai-java-pgvector -am
          -Dpostgresql.version=${{ matrix.jdbc }}
          '-Dtest=TracedPgVectorStore*Test' -Dsurefire.failIfNoSpecifiedTests=false
          -Dpgvector.test.url=jdbc:postgresql://127.0.0.1:5432/pgvector_test test
      - name: Upload pgvector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-java-${{ matrix.java }}-jdbc-${{ matrix.jdbc }}
          path: java/traceai-java-pgvector/target/surefire-reports/

  verify:
    name: Build, test, and validate Central artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test the complete reactor
        run: mvn -B -ntp verify
      - name: Build sources and Javadocs without signing or publishing
        run: mvn -B -ntp -P release -Dgpg.skip package
      - name: Generate effective POMs
        run: mvn -B -ntp -P release help:effective-pom -Doutput=target/central-effective-pom.xml
      - name: Check Central metadata and version alignment
        run: python3 -I scripts/check_central.py --artifacts
      - name: Compile external Central-coordinate consumers and the OpenAI example
        run: |
          mvn -B -ntp -DskipTests install
          python3 -I scripts/test_consumers.py
          mvn -B -ntp -f examples/openai-example/pom.xml test
      - name: Validate self-contained JitPack POMs and external consumers
        run: |
          ./mvnw -B -ntp -P jitpack -DskipTests install
          python3 -I scripts/test_consumers.py --check-jitpack-poms
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: java/**/target/surefire-reports/
          if-no-files-found: warn
