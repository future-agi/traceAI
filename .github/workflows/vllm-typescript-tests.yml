name: vLLM TypeScript contracts

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_vllm/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/vllm-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: vLLM OpenAI ${{ matrix.openai }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        openai: ['4.0.0', '7.47.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        working-directory: typescript
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/vllm... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/vllm-sdk" --ignore-scripts --no-audit --no-fund "openai@${{ matrix.openai }}"
      - name: Build CJS and ESM packages
        working-directory: typescript
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/vllm run build
      - name: Test real resources and OTLP with loopback only
        working-directory: typescript/packages/traceai_vllm
        env:
          OPENAI_MODULE: ${{ runner.temp }}/vllm-sdk/node_modules/openai/index.js
        run: |
          # Invoke installed executables directly: root has a different Corepack cache.
          sudo --preserve-env=PATH,OPENAI_MODULE unshare --net bash -c '
            set -e
            ip link set lo up
            node node_modules/jest/bin/jest.js --config jest.config.js --runInBand
            node --test test/real-sdk.cjs
            node test/automatic.cjs
          '
