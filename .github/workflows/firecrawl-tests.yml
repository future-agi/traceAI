name: Firecrawl compatibility

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/firecrawl/**'
      - '.github/workflows/firecrawl-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/firecrawl/**'
      - '.github/workflows/firecrawl-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_DOTENV_DISABLED: '1'
  FI_API_KEY: synthetic-fi-key
  FI_SECRET_KEY: synthetic-fi-secret
  FI_BASE_URL: http://127.0.0.1:9
  FI_GRPC_URL: http://127.0.0.1:9

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            firecrawl: '4.46.2'
            distribution: wheel
          - python: '3.10'
            firecrawl: latest
            distribution: sdist
          - python: '3.13'
            firecrawl: '4.46.2'
            distribution: sdist
          - python: '3.13'
            firecrawl: latest
            distribution: wheel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install a distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          FIRECRAWL_VERSION: ${{ matrix.firecrawl }}
        run: |
          python -m pip install 'build>=1.2,<2' poetry-core
          python -m build python/frameworks/firecrawl --outdir "$RUNNER_TEMP/dist"
          if [ "$DISTRIBUTION" = wheel ]; then
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.whl' -print -quit)
          else
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.tar.gz' -print -quit)
          fi
          if [ "$FIRECRAWL_VERSION" = latest ]; then
            upstream='firecrawl-py>=4.46.2,<5'
          else
            upstream="firecrawl-py==$FIRECRAWL_VERSION"
          fi
          python -m pip install "$artifact" "$upstream" 'pytest>=8,<9' pytest-asyncio
      - name: Run installed package tests with only loopback network
        run: |
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          python -I -m pytest --noconftest python/frameworks/firecrawl/tests -q
