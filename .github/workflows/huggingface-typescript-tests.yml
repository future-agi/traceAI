name: Hugging Face TypeScript tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_huggingface/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/huggingface-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_huggingface/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/huggingface-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Hugging Face SDK contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20.8', '22.23.4']
    defaults:
      run:
        working-directory: typescript
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@10.30.1
          pnpm --filter @traceai/huggingface... install --frozen-lockfile --ignore-scripts
      - name: Build CommonJS and ESM packages
        run: pnpm --filter @traceai/huggingface... run build
      - name: Unit and real SDK contracts with network isolation
        working-directory: typescript/packages/traceai_huggingface
        run: |
          # No external interfaces: only the local OTLP receiver can be reached.
          sudo unshare --net -- bash -euc '
            ip link set lo up
            "$1" node_modules/jest/bin/jest.js --config jest.config.js --runInBand
            "$1" --test tests/sdk-contract.cjs tests/real-sdk.cjs tests/auto.cjs
          ' bash "$(command -v node)"
