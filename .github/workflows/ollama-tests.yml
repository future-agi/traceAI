name: Ollama tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_ollama/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/ollama-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_ollama/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/ollama-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streams:
    name: Ollama ${{ matrix.sdk }} stream contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.4.0', '0.6.4']
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install workspace and isolated SDK
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/ollama... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/ollama-sdk" --ignore-scripts --no-audit --no-fund "ollama@${{ matrix.sdk }}"
      - name: Build CommonJS and ESM packages
        run: |
          corepack pnpm run build:deps
          corepack pnpm --filter @traceai/ollama run build
      - name: Unit and OTLP wire tests with only loopback networking
        run: |
          # An isolated network namespace permits the local OTLP receiver, not vendor APIs.
          NODE="$(command -v node)"
          JEST="$(node -p 'require.resolve("jest/bin/jest")')"
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            "$NODE" "$JEST" --config packages/traceai_ollama/jest.config.js --runInBand
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env OLLAMA_SDK_PATH="$RUNNER_TEMP/ollama-sdk/node_modules/ollama" \
            "$NODE" --test --test-timeout=15000 packages/traceai_ollama/test/streams.test.cjs
      - name: Confirm no generated version or lockfile changes
        run: git diff --exit-code
