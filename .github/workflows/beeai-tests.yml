name: BeeAI tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_beeai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/beeai-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_beeai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/beeai-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beeai:
    name: BeeAI ${{ matrix.sdk }} offline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.1.2', '0.1.31']
    defaults:
      run:
        working-directory: typescript
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install workspace and isolated framework dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin" "$RUNNER_TEMP/beeai"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/beeai... install --frozen-lockfile --ignore-scripts
          # Optional provider peers are unnecessary for synthetic model subclasses.
          npm install --prefix "$RUNNER_TEMP/beeai" --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
            beeai-framework@${{ matrix.sdk }} zod@3.25.76
      - name: Build the package and its dependencies
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/beeai run build
      - name: Unit and real-framework contracts with network disabled
        run: |
          # Only loopback exists in the test namespace; OTLP goes to its local receiver.
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" "$PWD/packages/traceai_beeai/node_modules/.bin/jest" \
            --config "$PWD/packages/traceai_beeai/jest.config.js" --runInBand
          for mode in cjs esm; do
            for registration in root context auto; do
              if [[ "$mode" == esm && "$registration" == auto ]]; then continue; fi
              sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
                env BEEAI_MODULE_ROOT="$RUNNER_TEMP/beeai" BEEAI_MODE="$mode" BEEAI_REGISTRATION="$registration" \
                "$(command -v node)" --test packages/traceai_beeai/src/__tests__/contract.test.cjs
            done
          done
      - name: Check package contents and lockfile
        run: |
          pnpm --dir packages/traceai_beeai pack --pack-destination "$RUNNER_TEMP"
          git diff --exit-code -- pnpm-lock.yaml
