name: Cohere TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_cohere/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/pnpm-workspace.yaml'
      - 'typescript/package.json'
      - '.github/workflows/cohere-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohere:
    name: Cohere SDK floor and current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    env:
      FI_BASE_URL: http://127.0.0.1:9
      FI_GRPC_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install pinned SDK fixtures
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '@traceai/cohere...'
      - name: Build package and shared dependencies
        run: pnpm --filter '@traceai/cohere...' --workspace-concurrency=1 run build
      - name: Real SDK, lifecycle, ESM and OTLP tests with network isolated
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' _ \
            "$(command -v node)" node_modules/jest/bin/jest.js \
            --config packages/traceai_cohere/jest.config.js --runInBand
      - name: Package tarball
        run: pnpm --filter '@traceai/cohere' pack --pack-destination "$RUNNER_TEMP/cohere-package"
