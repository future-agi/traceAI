name: LlamaIndex Workflows tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'python/frameworks/llama_index/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/llamaindex-workflows-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/llama_index/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/llamaindex-workflows-tests.yml'

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core 0.13 uses the shared standalone dispatcher and
          # declares workflows>=1.0.1,<2. This is that route's floor, not a
          # change to the instrumentor's legacy-core support range.
          - name: standalone-floor
            core: '0.13.0'
            workflows: '1.0.1'
          - name: current
            core: '0.14.25'
            workflows: '2.26.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration and framework
        run: >-
          python -m pip install -e python -e python/frameworks/llama_index
          'llama-index-core==${{ matrix.core }}'
          'llama-index-workflows==${{ matrix.workflows }}'
          'pytest==8.4.2' 'pytest-asyncio==0.24.0' 'pytest-socket==0.8.1'
      - name: Test real workflow and OTLP contract without outbound connections
        run: >-
          python -I -m pytest python/frameworks/llama_index/tests
          -q -p no:cacheprovider --disable-socket --allow-unix-socket
