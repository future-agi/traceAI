name: LlamaIndex Workflows tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'python/frameworks/llama_index/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/llamaindex-workflows-tests.yml'
      - '.github/scripts/llamaindex_core_floor.py'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/llama_index/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/llamaindex-workflows-tests.yml'
      - '.github/scripts/llamaindex_core_floor.py'

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The instrumentor's declared floor (llama-index-core>=0.10.43). It
          # predates standalone Workflows, so those tests skip here.
          - name: legacy-floor
            packages: >-
              'llama-index-core==0.10.43'
              'llama-index-llms-openai==0.1.26'
              'openai==1.49.0'
          # Core 0.13 uses the shared standalone dispatcher and
          # declares workflows>=1.0.1,<2. This is that route's floor, not a
          # change to the instrumentor's legacy-core support range.
          - name: standalone-floor
            packages: >-
              'llama-index-core==0.13.0'
              'llama-index-workflows==1.0.1'
              'llama-index-llms-openai==0.5.6'
          - name: current
            packages: >-
              'llama-index-core==0.14.25'
              'llama-index-workflows==2.26.1'
              'llama-index-llms-openai==0.8.3'
          # The lowest fi-instrumentation-otel the package declares, from PyPI
          # instead of this repo's core, with the latest LlamaIndex.
          - name: core-floor
            core: declared-floor
            packages: >-
              'llama-index-core==0.14.25'
              'llama-index-workflows==2.26.1'
              'llama-index-llms-openai==0.8.3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration and framework
        env:
          CORE: ${{ matrix.core }}
        run: |
          if [ "$CORE" = declared-floor ]; then
            floor=$(python -I .github/scripts/llamaindex_core_floor.py)
            core="fi-instrumentation-otel==$floor"
          else
            core="-e python"
          fi
          echo "core: $core"
          python -m pip install $core -e python/frameworks/llama_index \
            ${{ matrix.packages }} \
            'pytest==8.4.2' 'pytest-asyncio==0.24.0' 'pytest-socket==0.8.1'
          python -m pip show fi-instrumentation-otel
      - name: Test real workflow and OTLP contract without outbound connections
        run: >-
          python -I -m pytest python/frameworks/llama_index/tests
          -q -p no:cacheprovider --disable-socket --allow-unix-socket
