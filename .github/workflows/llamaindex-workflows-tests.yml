name: LlamaIndex Workflows tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'python/frameworks/llama_index/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/llamaindex-workflows-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/llama_index/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/llamaindex-workflows-tests.yml'

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core before 0.12.43 embeds its own Workflow class and names the
          # run span "Workflow.run". 0.12.41 also exits a user-cancelled run
          # with no result, so the instrumentor must read the outcome.
          - name: embedded-core
            core: '0.12.41'
            workflows: ''
            openai: '0.4.7'
          # Core 0.13 uses the shared standalone dispatcher and
          # declares workflows>=1.0.1,<2. This is that route's floor, not a
          # change to the instrumentor's legacy-core support range.
          - name: standalone-floor
            core: '0.13.0'
            workflows: '1.0.1'
            openai: '0.5.6'
          # Before 2.16 Workflows leaves the run span's status to the
          # instrumentor. 2.14.0 returns a handler that is not a Future;
          # 2.15.1 is the last release before Workflows drops failed runs.
          - name: handler-not-future
            core: '0.14.25'
            workflows: '2.14.0'
            openai: '0.8.3'
          - name: last-before-2.16
            core: '0.14.25'
            workflows: '2.15.1'
            openai: '0.8.3'
          - name: current
            core: '0.14.25'
            workflows: '2.26.1'
            openai: '0.8.3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration and framework
        env:
          CORE: ${{ matrix.core }}
          WORKFLOWS: ${{ matrix.workflows }}
          OPENAI: ${{ matrix.openai }}
        run: |
          packages=("llama-index-core==${CORE}" "llama-index-llms-openai==${OPENAI}")
          if [ -n "${WORKFLOWS}" ]; then
            packages+=("llama-index-workflows==${WORKFLOWS}")
          fi
          python -m pip install -e python -e python/frameworks/llama_index \
            "${packages[@]}" \
            'pytest==8.4.2' 'pytest-asyncio==0.24.0' 'pytest-socket==0.8.1'
      - name: Check the embedded Workflow class is under test
        if: matrix.workflows == ''
        run: >-
          python -I -c "from llama_index.core.workflow import Workflow;
          assert Workflow.__module__.startswith('llama_index.core.'), Workflow.__module__"
      - name: Test real workflow and OTLP contract without outbound connections
        run: >-
          python -I -m pytest python/frameworks/llama_index/tests
          -q -p no:cacheprovider --disable-socket --allow-unix-socket
