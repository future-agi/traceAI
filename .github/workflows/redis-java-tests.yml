name: Redis Java compatibility

on:
  pull_request:
    paths:
      - 'java/traceai-java-redis/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/redis-java-tests.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/traceai-java-redis/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/redis-java-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Jedis ${{ matrix.jedis }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        jedis: ['5.1.0', '5.2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Prepare dependencies and JUnit provider without executing tests
        run: >-
          mvn -B -ntp -f java/pom.xml -pl traceai-java-redis -am
          -Djedis.version=${{ matrix.jedis }}
          -Dtest=TracedRedisVectorSearchTest,RedisOtlpTest
          -Dgroups=dependency-cache-only -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Test commands and OTLP wire payloads without external networking
        run: |
          sudo --preserve-env=JAVA_HOME,PATH unshare --net bash -c '
            ip link set lo up
            mvn -o -B -ntp -f java/pom.xml -pl traceai-java-redis -am \
              -Dmaven.repo.local="$1/.m2/repository" \
              -Djedis.version="$2" \
              -Dtest=TracedRedisVectorSearchTest,RedisOtlpTest \
              -Dsurefire.failIfNoSpecifiedTests=false test
          ' bash "$HOME" '${{ matrix.jedis }}'
