name: Genkit privacy tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_genkit/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/genkit-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_genkit/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/genkit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Genkit ${{ matrix.genkit }} privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        genkit: ['1.42.0', '1.43.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install and build package
        working-directory: typescript
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          export PATH="$RUNNER_TEMP/corepack-bin:$PATH"
          corepack pnpm --filter @traceai/genkit... install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @traceai/genkit... run build
      - name: Select Genkit version without changing the lockfile
        working-directory: typescript/packages/traceai_genkit
        env:
          GENKIT_VERSION: ${{ matrix.genkit }}
        run: |
          npm install --prefix "$RUNNER_TEMP/genkit" --ignore-scripts --no-audit --no-fund "genkit@$GENKIT_VERSION"
          ln -sfn "$RUNNER_TEMP/genkit/node_modules/genkit" node_modules/genkit
      - name: Unit tests and OTLP wire contracts with loopback-only networking
        working-directory: typescript/packages/traceai_genkit
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            "$(command -v node)" node_modules/jest/bin/jest.js --runInBand
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            "$(command -v node)" contract/error_privacy.mjs
          git diff --exit-code -- ../../pnpm-lock.yaml
