name: Strands native adapter

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/strands/**'
      - '.github/workflows/strands-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/strands/**'
      - '.github/workflows/strands-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        strands: ['1.24.0', '1.63.0']
        distribution: ['wheel', 'sdist']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          STRANDS_VERSION: ${{ matrix.strands }}
        run: |
          python -m pip install 'build>=1.2,<2' 'hatchling>=1.27,<2'
          python -m build python/frameworks/strands --outdir "$RUNNER_TEMP/dist"
          if [ "$DISTRIBUTION" = wheel ]; then
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.whl' -print -quit)
          else
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.tar.gz' -print -quit)
          fi
          python -m pip install "${artifact}[dev]" "strands-agents[otel,openai]==$STRANDS_VERSION"
      - name: Test real Strands with only loopback networking
        run: |
          # Isolate only the tests; runner-wide firewall rules also disconnect
          # the Actions runner from GitHub while pytest is running.
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set dev lo up
            exec sudo -H -u "$1" -- env PATH="$2" LD_LIBRARY_PATH="$3" bash -euo pipefail -s
          ' bash "$(id -un)" "$PATH" "${LD_LIBRARY_PATH:-}" <<'TESTS'
          # Literal IPs and no proxy avoid mistaking DNS/proxy errors for isolation.
          command -v curl >/dev/null
          for url in http://1.1.1.1 'http://[2606:4700:4700::1111]'; do
            if curl --noproxy '*' --connect-timeout 2 --max-time 3 --silent --output /dev/null "$url"; then
              echo "::error::Non-loopback networking is reachable: $url"
              exit 1
            fi
            echo "Confirmed non-loopback connection blocked: $url"
          done
          python -I -m pytest python/frameworks/strands/tests python/frameworks/strands/tests_native -q
          TESTS
