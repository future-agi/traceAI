name: Semantic Kernel Java compatibility

on:
  pull_request:
    paths:
      - 'java/traceai-java-semantic-kernel/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/semantic-kernel-java-tests.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/traceai-java-semantic-kernel/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/semantic-kernel-java-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-kernel:
    name: Semantic Kernel ${{ matrix.semantic-kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        semantic-kernel: ['1.4.5', '1.5.0']
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Exercise synthetic SDK transport and OTLP loopback collector
        run: >-
          mvn -B -ntp -pl traceai-java-semantic-kernel -am test
          -Dsemantic-kernel.version=${{ matrix.semantic-kernel }}
          -Dtest=ReactiveLifecycleTest,NativeTelemetryTest,OtlpWireTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Djava.net.preferIPv4Stack=true
      - name: Repeat offline with network namespace limited to loopback
        run: |
          sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" unshare --net sh -c '
            ip link set lo up
            exec mvn -o -B -ntp -Dmaven.repo.local="$1" -pl traceai-java-semantic-kernel -am test \
              -Dsemantic-kernel.version="$2" \
              -Dtest=ReactiveLifecycleTest,NativeTelemetryTest,OtlpWireTest \
              -Dsurefire.failIfNoSpecifiedTests=false -Djava.net.preferIPv4Stack=true
          ' sh "$HOME/.m2/repository" '${{ matrix.semantic-kernel }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-kernel-${{ matrix.semantic-kernel }}-reports
          path: java/traceai-java-semantic-kernel/target/surefire-reports/

  legacy-binary:
    name: Semantic Kernel binary consumers (1.3, 1.4, 1.5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Build current adapter and fetch published legacy API
        run: |
          mvn -B -ntp -pl traceai-java-semantic-kernel -am install -DskipTests
          mvn -B -ntp dependency:get -Dartifact=com.microsoft.semantic-kernel:semantickernel-api:1.3.0 -Dtransitive=false
          mvn -B -ntp dependency:get -Dartifact=com.microsoft.semantic-kernel:semantickernel-aiservices-openai:1.3.0 -Dtransitive=false
          mvn -B -ntp -pl traceai-java-semantic-kernel dependency:build-classpath \
            -Dmdep.outputFile=target/compat.classpath
      - name: Compile consumers against each published ABI and run without outbound network
        run: |
          base="$(cat traceai-java-semantic-kernel/target/compat.classpath)"
          for version in 1.3.0 1.4.5 1.5.0; do
            deps="$(printf '%s' "$base" | sed -E "s#(semantickernel-[^/:]+)/1\\.5\\.0(/semantickernel-[^/:]+-)1\\.5\\.0(\\.jar)#\\1/$version\\2$version\\3#g")"
            mkdir -p "traceai-java-semantic-kernel/target/consumer-$version"
            cp="traceai-java-semantic-kernel/target/classes:traceai-java-core/target/classes:$deps"
            javac -cp "$cp" -d "traceai-java-semantic-kernel/target/consumer-$version" \
              traceai-java-semantic-kernel/src/test/compat/LegacyBinaryCompatibility.java
            sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" unshare --net sh -c '
              ip link set lo up
              exec java -cp "$1" LegacyBinaryCompatibility
            ' sh "traceai-java-semantic-kernel/target/consumer-$version:$cp"
          done
