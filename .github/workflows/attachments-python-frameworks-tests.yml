name: Python framework attachments

# Real LangChain, LlamaIndex, Agno and Pydantic AI (declared floor and latest) through
# the Python framework instrumentors to a TLS loopback F01 attachment server, with and
# without traceai_openai on the same manager. Outbound network is disabled while the
# tests run.

on:
  pull_request:
    paths:
      - 'python/fi_instrumentation/attachments/**'
      - 'python/frameworks/langchain/**'
      - 'python/frameworks/llama_index/**'
      - 'python/frameworks/agno/**'
      - 'python/frameworks/pydantic-ai/**'
      - 'python/frameworks/openai/**'
      - 'python/tests/attachments_frameworks/**'
      - 'python/tests/attachments_providers/conftest.py'
      - '.github/workflows/attachments-python-frameworks-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/fi_instrumentation/attachments/**'
      - 'python/frameworks/langchain/**'
      - 'python/frameworks/llama_index/**'
      - 'python/frameworks/agno/**'
      - 'python/frameworks/pydantic-ai/**'
      - 'python/frameworks/openai/**'
      - 'python/tests/attachments_frameworks/**'
      - 'python/tests/attachments_providers/conftest.py'
      - '.github/workflows/attachments-python-frameworks-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frameworks:
    name: Framework attachments (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Declared floors (ChatMessage blocks need llama-index-core 0.12.3+).
          - name: floor
            python: '3.10'
            sdks: >-
              langchain-core==0.2.43 llama-index-core==0.12.41 agno==2.7.2
              openinference-instrumentation-agno==1.1.0 pydantic-ai-slim[openai]==0.1.0 openai==1.74.0
              'httpx<0.28'
          # Latest releases, including the framework OpenAI integrations for the dedup tests.
          - name: latest
            python: '3.12'
            sdks: >-
              langchain-core==1.8.0 langchain-openai==1.7.4 llama-index-core==0.14.25
              llama-index-llms-openai==0.8.4 agno==3.1.12 openinference-instrumentation-agno==1.1.0
              pydantic-ai-slim[openai]==2.67.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install source integrations and the selected frameworks
        env:
          SDKS: ${{ matrix.sdks }}
        run: |
          python -m venv .venv
          # shellcheck disable=SC2086
          eval .venv/bin/pip install -e python -e python/frameworks/openai -e python/frameworks/langchain \
            -e python/frameworks/llama_index -e python/frameworks/agno -e python/frameworks/pydantic-ai \
            opentelemetry-sdk "'pytest>=7,<9'" $SDKS
          .venv/bin/pip freeze | grep -iE '^(langchain|llama-index-core|llama-index-llms|agno|pydantic-ai|openai|openinference)' || true
      - name: Run with outbound network disabled
        run: |
          sudo unshare --net -- bash -e -c '
            ip link set lo up
            cd "$2/python"
            AGNO_TELEMETRY=false PYTHONPATH=. "$1" -m pytest tests/attachments_frameworks -q -p no:cacheprovider \
              -o addopts="" -o faulthandler_timeout=120
          ' _ "$PWD/.venv/bin/python" "$PWD"
