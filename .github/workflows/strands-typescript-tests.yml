name: Strands TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_strands/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/strands-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_strands/**'
      - '.github/workflows/strands-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Strands ${{ matrix.sdk }} / OTel ${{ matrix.otel }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: '0.1.0', otel: '2.0.1', resources: '2.0.1', node: '22.23.4', suite: legacy }
          - { sdk: '0.1.6', otel: '2.0.1', resources: '2.0.1', node: '22.23.4', suite: legacy }
          - { sdk: '1.23.0', otel: '2.6.1', resources: '2.8.0', node: '22.23.4', suite: native }
          - { sdk: '1.23.0', otel: '2.12.0', resources: '2.12.0', node: '26.8.1', suite: native }
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install frozen package dependencies
        run: |
          corepack enable
          pnpm --filter @traceai/strands... install --frozen-lockfile --ignore-scripts
      - name: Build, unit test and pack
        run: |
          pnpm --filter @traceai/strands... run build
          pnpm --filter @traceai/strands test --runInBand
          mkdir -p "$RUNNER_TEMP/strands-package"
          pnpm --dir packages/traceai_strands pack --pack-destination "$RUNNER_TEMP/strands-package"
          git diff --exit-code -- pnpm-lock.yaml
      - name: Install real framework with the tarball in a clean project
        env:
          SDK_VERSION: ${{ matrix.sdk }}
          OTEL_VERSION: ${{ matrix.otel }}
          RESOURCE_VERSION: ${{ matrix.resources }}
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p "$RUNNER_TEMP/strands-consumer"
          extras=()
          if [ "$SUITE" = native ]; then
            extras=(@opentelemetry/exporter-trace-otlp-http@0.219.0
              @opentelemetry/exporter-trace-otlp-proto@0.219.0 protobufjs@7.5.4 openai@6.45.0
              typescript@5.8.3 @types/node@22.15.33)
          fi
          # Resolve the complete app together, as in the README. Installing the
          # legacy core's transitive exporters first can hoist incompatible
          # optional Strands peers before the native exporters are present.
          npm install --prefix "$RUNNER_TEMP/strands-consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP"/strands-package/*.tgz \
            "@strands-agents/sdk@$SDK_VERSION" \
            "@opentelemetry/sdk-trace-node@$OTEL_VERSION" \
            "@opentelemetry/sdk-trace-base@$OTEL_VERSION" \
            "@opentelemetry/resources@$RESOURCE_VERSION" "${extras[@]}"
      - name: Packed framework and wire contracts (loopback-only network namespace)
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          tests=("$PWD/packages/traceai_strands/test/$SUITE.test.mjs")
          if [ "$SUITE" = native ]; then
            tests+=("$PWD/packages/traceai_strands/test/wire.test.mjs")
          fi
          sudo unshare --net bash -c 'ip link set lo up; exec "$@"' _ \
            env STRANDS_TEST_ROOT="$RUNNER_TEMP/strands-consumer" STRANDS_TEST_PACKED=1 \
            "$(command -v node)" --test "${tests[@]}"
