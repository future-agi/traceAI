name: OpenAI API promise tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_openai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/openai-api-promise-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: OpenAI APIPromise ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 6/7 are manual-instrumentation probes, not an expanded peer range.
        sdk: ['4.0.0', '5.23.2', '6.0.0', '7.47.0']
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install pinned dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/openai... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/openai-sdk" --ignore-scripts --no-audit --no-fund "openai@${{ matrix.sdk }}"
      - name: Build package
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/openai run build
      - name: Network-isolated SDK and OTLP wire contracts
        env:
          OPENAI_SDK_PATH: ${{ runner.temp }}/openai-sdk/node_modules/openai
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_SDK_PATH="$OPENAI_SDK_PATH" \
            node --test packages/traceai_openai/test/apiPromise.cjs
      - name: Network-isolated locked SDK unit suite
        if: matrix.sdk == '5.23.2'
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" pnpm --filter @traceai/openai test --runInBand
