name: ElevenLabs Agents contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/elevenlabs-agents/**'
      - '.github/workflows/elevenlabs-agents-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/elevenlabs-agents/**'
      - '.github/workflows/elevenlabs-agents-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: ElevenLabs (${{ matrix.elevenlabs }}, Python ${{ matrix.python }}, ${{ matrix.distribution }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            elevenlabs: '2.70.0'
            instrumentation: '0.1.11'
            distribution: wheel
          - python: '3.13'
            elevenlabs: '2.75.0'
            instrumentation: '1.2.2'
            distribution: sdist
    env:
      ELEVENLABS_VERSION: ${{ matrix.elevenlabs }}
      INSTRUMENTATION_VERSION: ${{ matrix.instrumentation }}
      DISTRIBUTION: ${{ matrix.distribution }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install distributions
        shell: bash
        run: |
          python -m venv .elevenlabs-build
          .elevenlabs-build/bin/pip install build
          .elevenlabs-build/bin/python -m build python/frameworks/elevenlabs-agents
          python -m venv .elevenlabs-test
          if [ "$DISTRIBUTION" = wheel ]; then
            packages=(python/frameworks/elevenlabs-agents/dist/*.whl)
          else
            packages=(python/frameworks/elevenlabs-agents/dist/*.tar.gz)
          fi
          .elevenlabs-test/bin/pip install "${packages[@]}" \
            "elevenlabs==$ELEVENLABS_VERSION" "fi-instrumentation-otel==$INSTRUMENTATION_VERSION" \
            pytest opentelemetry-proto
      - name: Test with only loopback networking
        shell: bash
        run: |
          sudo unshare --net bash -c '
            set -e
            ip link set lo up
            "$1" -I -m pytest python/frameworks/elevenlabs-agents/tests \
              --confcutdir=python/frameworks/elevenlabs-agents/tests \
              -o addopts="" -q -p no:cacheprovider
          ' _ "$PWD/.elevenlabs-test/bin/python"
