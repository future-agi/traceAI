name: Fireworks TypeScript contracts

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_fireworks/**'
      - 'typescript/packages/traceai_openai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/provider-media/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/fireworks-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Fireworks OpenAI SDK ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Declared floor, each supported major, and the current release.
        sdk: ['4.0.0', '5.23.2', '6.0.0', '7.47.0']
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install pinned workspace dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/fireworks... install --frozen-lockfile --ignore-scripts
      - name: Build both packages and install their tarballs in a clean consumer
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/openai --filter @traceai/fireworks run build
          pnpm --dir packages/fi-core pack --out "$RUNNER_TEMP/fi-core.tgz"
          pnpm --dir packages/traceai_openai pack --out "$RUNNER_TEMP/openai.tgz"
          pnpm --dir packages/traceai_fireworks pack --out "$RUNNER_TEMP/fireworks.tgz"
          pnpm --dir packages/provider-media pack --out "$RUNNER_TEMP/provider-media.tgz"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP/openai.tgz" "$RUNNER_TEMP/fireworks.tgz" "openai@${{ matrix.sdk }}" \
            "$RUNNER_TEMP/fi-core.tgz" "$RUNNER_TEMP/provider-media.tgz" @traceai/fi-semantic-conventions@1.0.0 \
            @opentelemetry/sdk-trace-base@2.0.1 @opentelemetry/exporter-trace-otlp-http@0.202.0 \
            typescript@5.8.3 @types/node@22.15.29
      - name: Network-isolated automatic, manual and dual-instrumentor contracts
        env:
          FIREWORKS_CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: |
          for manual in false true; do
            for both in false true; do
              sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
                env PATH="$PATH" FIREWORKS_CONSUMER_DIR="$FIREWORKS_CONSUMER_DIR" \
                FIREWORKS_TEST_MANUAL="$manual" FIREWORKS_TEST_BOTH="$both" \
                node --test packages/traceai_fireworks/test/sharedRoute.cjs
            done
          done
      - name: Run and typecheck the README recipe
        # OpenAI 4.0 sends requests through its node-fetch shim, which the recipe's
        # synthetic global fetch cannot intercept.
        if: matrix.sdk != '4.0.0'
        env:
          FIREWORKS_CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" FIREWORKS_CONSUMER_DIR="$FIREWORKS_CONSUMER_DIR" \
            node --test packages/traceai_fireworks/test/readme.cjs
          "$FIREWORKS_CONSUMER_DIR/node_modules/.bin/tsc" --noEmit --module nodenext --target es2022 \
            "$FIREWORKS_CONSUMER_DIR/fireworks.mts"
      - name: Load the ESM build
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module -e "
            import { FireworksInstrumentation, isPatched } from '@traceai/fireworks';
            new FireworksInstrumentation().manuallyInstrument(await import('openai'));
            if (!isPatched()) throw new Error('ESM SDK module was not instrumented');
          "
      - name: Network-isolated package and ownership tests
        env:
          OPENAI_TEST_MODULE: ${{ runner.temp }}/consumer/node_modules/openai
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_TEST_MODULE="$OPENAI_TEST_MODULE" \
            node packages/traceai_fireworks/node_modules/jest/bin/jest.js \
            --config packages/traceai_fireworks/jest.config.js --runInBand
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_TEST_MODULE="$OPENAI_TEST_MODULE" \
            node packages/traceai_openai/node_modules/jest/bin/jest.js \
            --config packages/traceai_openai/jest.config.js --runInBand --runTestsByPath \
            packages/traceai_openai/src/__tests__/patchOwnership.test.ts \
            packages/traceai_openai/src/__tests__/provider.test.ts
