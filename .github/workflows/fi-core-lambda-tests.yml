name: TypeScript Lambda lifecycle tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/tsconfig*'
      - '.github/workflows/fi-core-lambda-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/tsconfig*'
      - '.github/workflows/fi-core-lambda-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lambda:
    name: Lambda Node ${{ matrix.node }} OTel ${{ matrix.otel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15.0', '22.23.4', '24.22.2', '26.13.0']
        otel: ['2.0.1', '2.12.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install build tooling and pack core
        working-directory: typescript
        run: |
          npm install --prefix "$RUNNER_TEMP/build-tools" --ignore-scripts --no-audit --no-fund pnpm@10.30.1
          export PATH="$RUNNER_TEMP/build-tools/node_modules/.bin:$PATH"
          pnpm --filter @traceai/fi-core... install --frozen-lockfile --ignore-scripts
          pnpm --filter @traceai/fi-semantic-conventions run build
          pnpm --filter @traceai/fi-core run build
          mkdir -p "$RUNNER_TEMP/tarballs"
          pnpm --dir packages/fi-semantic-conventions pack --pack-destination "$RUNNER_TEMP/tarballs"
          pnpm --dir packages/fi-core pack --pack-destination "$RUNNER_TEMP/tarballs"
      - name: Install clean packed Lambda fixture
        env:
          OTEL_TEST_VERSION: ${{ matrix.otel }}
        run: |
          node typescript/packages/fi-core/test/install-lambda-fixture.cjs "$OTEL_TEST_VERSION" "$RUNNER_TEMP/lambda-fixture" \
            "$RUNNER_TEMP"/tarballs/traceai-fi-core-*.tgz "$RUNNER_TEMP"/tarballs/traceai-fi-semantic-conventions-*.tgz
      - name: Run lifecycle and runtime-interface tests with loopback only
        run: |
          NODE="$(command -v node)"
          sudo unshare --net sh -c '
            ip link set lo up
            export FI_CORE_PACKAGE_JSON="$1/node_modules/@traceai/fi-core/package.json"
            "$2" --test --test-concurrency=1 "$3/typescript/packages/fi-core/test/lambda-lifecycle.test.cjs" "$3/typescript/packages/fi-core/test/lambda-runtime.test.cjs" "$3/typescript/packages/fi-core/test/lambda-callback-runtime.test.cjs" "$3/typescript/packages/fi-core/test/lambda-classification.test.cjs"
          ' sh "$RUNNER_TEMP/lambda-fixture" "$NODE" "$GITHUB_WORKSPACE"
