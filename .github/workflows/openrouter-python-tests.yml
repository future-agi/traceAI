name: OpenRouter Python SDK contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/openrouter/**'
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/openrouter-python-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/openrouter/**'
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/openrouter-python-tests.yml'

permissions:
  contents: read

jobs:
  sdk-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            openrouter: '1.3.0'
            artifact: wheel
          - python: '3.13'
            openrouter: '1.3.107'
            artifact: sdist
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install packages
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          OPENROUTER_VERSION: ${{ matrix.openrouter }}
        run: |
          python -m venv .openrouter-test-venv
          .openrouter-test-venv/bin/pip install build
          .openrouter-test-venv/bin/python -m build "--$ARTIFACT" python/frameworks/openrouter
          .openrouter-test-venv/bin/python -m build "--$ARTIFACT" python/frameworks/openai
          if [ "$ARTIFACT" = wheel ]; then
            packages=(python/frameworks/{openrouter,openai}/dist/*.whl)
          else
            packages=(python/frameworks/{openrouter,openai}/dist/*.tar.gz)
          fi
          .openrouter-test-venv/bin/pip install "${packages[@]}" \
            "openrouter==$OPENROUTER_VERSION" pytest pytest-asyncio
      - name: Run SDK and attribution tests without external traffic
        shell: bash
        run: |
          sudo unshare --net bash -c '
            set -e
            ip link set lo up
            "$1" -I -m pytest python/frameworks/openrouter/tests \
              python/frameworks/openai/tests/test_openai_compatible_spans.py \
              -q -p no:cacheprovider
          ' _ "$PWD/.openrouter-test-venv/bin/python"
