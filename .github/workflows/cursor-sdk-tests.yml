name: Cursor SDK tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_cursor_sdk/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/pnpm-workspace.yaml'
      - 'typescript/package.json'
      - '.github/workflows/cursor-sdk-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cursor-sdk:
    name: Cursor SDK build and tests (${{ matrix.sdk-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk-version: ['1.0.37', '1.2.0', '1.3.1']
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    env:
      FI_BASE_URL: http://127.0.0.1:9
      FI_GRPC_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Frozen filtered install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '@traceai/cursor-sdk...'
      - name: Install matrix SDK without changing workspace lockfile
        env:
          CURSOR_SDK_VERSION: ${{ matrix.sdk-version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/cursor-sdk" --ignore-scripts --no-audit --no-fund "@cursor/sdk@$CURSOR_SDK_VERSION"
          rm packages/traceai_cursor_sdk/node_modules/@cursor/sdk
          ln -s "$RUNNER_TEMP/cursor-sdk/node_modules/@cursor/sdk" packages/traceai_cursor_sdk/node_modules/@cursor/sdk
      - name: Build package and shared dependencies
        run: pnpm --filter '@traceai/cursor-sdk...' --workspace-concurrency=1 run build
      - name: Offline tests and real SDK type contract
        run: |
          pnpm --filter '@traceai/cursor-sdk' exec jest --runInBand
          pnpm --filter '@traceai/cursor-sdk' run typecheck:contract
      - name: Real SDK loopback lifecycle and token regressions
        run: pnpm --filter '@traceai/cursor-sdk' exec node --test contract/real_sdk_runs.cjs
      - name: Package tarball
        run: pnpm --filter '@traceai/cursor-sdk' pack --pack-destination "$RUNNER_TEMP/cursor-package"
