name: Anthropic TypeScript tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_anthropic/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/anthropic-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_anthropic/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/anthropic-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Anthropic TypeScript native boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install workspace and pinned real SDK fixtures
        working-directory: typescript
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/anthropic... install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/anthropic-contract"
          npm install --prefix "$RUNNER_TEMP/anthropic-contract" --ignore-scripts --no-audit --no-fund \
            @anthropic-ai/sdk@1.3.0 \
            anthropic-floor@npm:@anthropic-ai/sdk@0.20.0 \
            anthropic-peer@npm:@anthropic-ai/sdk@0.27.3 \
            @opentelemetry/api@1.9.0 \
            @opentelemetry/sdk-trace-base@2.4.0 \
            @opentelemetry/context-async-hooks@2.4.0 \
            @opentelemetry/exporter-trace-otlp-http@0.208.0
      - name: Build all package formats
        working-directory: typescript
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/anthropic run build
      - name: Unit tests and SDK contracts without external networking
        working-directory: typescript
        run: |
          # A separate network namespace exposes only loopback for the OTLP receiver.
          # Run tests as the unprivileged runner, with no inherited credentials.
          mkdir -p "$RUNNER_TEMP/anthropic-test-home"
          node_bin="$(command -v node)"
          sudo unshare --net sh -c 'ip link set lo up; exec runuser -u runner -- "$@"' sh \
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/anthropic-test-home" \
            "$node_bin" node_modules/jest/bin/jest.js --config packages/traceai_anthropic/jest.config.js --runInBand
          for sdk in @anthropic-ai/sdk anthropic-floor anthropic-peer; do
            sudo unshare --net sh -c 'ip link set lo up; exec runuser -u runner -- "$@"' sh \
              env -i PATH="$PATH" HOME="$RUNNER_TEMP/anthropic-test-home" \
              "$node_bin" packages/traceai_anthropic/contract/native-boundary.cjs \
              "$RUNNER_TEMP/anthropic-contract" "$sdk" \
              packages/traceai_anthropic/dist/src/instrumentation.js
          done
          git diff --exit-code -- pnpm-lock.yaml
