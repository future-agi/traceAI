name: Groq TypeScript tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_groq/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/tsconfig*.json'
      - '.github/workflows/groq-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_groq/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/groq-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Groq SDK ${{ matrix.sdk }} offline contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.3.0', '1.6.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install dependencies and pinned SDK fixture
        working-directory: typescript
        env:
          GROQ_SDK_VERSION: ${{ matrix.sdk }}
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/groq... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/groq-sdk" --ignore-scripts --no-audit --no-fund "groq-sdk@$GROQ_SDK_VERSION"
      - name: Build tracing dependencies and Groq
        working-directory: typescript
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/groq run build
      - name: SDK contracts and OTLP wire tests (loopback only)
        env:
          GROQ_TEST_SDK: ${{ runner.temp }}/groq-sdk/node_modules/groq-sdk
        run: |
          # A separate network namespace has only loopback, including the
          # synthetic OTLP collector; even accidental provider calls cannot leave.
          sudo --preserve-env=GROQ_TEST_SDK unshare --net bash -c '
            ip link set lo up
            "$1" typescript/node_modules/jest/bin/jest.js \
              --config typescript/packages/traceai_groq/jest.config.js --runInBand &&
            env -i PATH="$PATH" "$1" typescript/packages/traceai_groq/contract/readme-smoke.cjs "$PWD" "$GROQ_TEST_SDK"
          ' _ "$(command -v node)"
      - name: Verify lockfile stays unchanged
        run: git diff --exit-code -- typescript/pnpm-lock.yaml
