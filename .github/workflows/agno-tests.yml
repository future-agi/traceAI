name: Agno tracing

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/agno/**'
      - '.github/workflows/agno-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/agno/**'
      - '.github/workflows/agno-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        agno: ['2.7.2', '3.1.12']
        distribution: ['wheel', 'sdist']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          AGNO_VERSION: ${{ matrix.agno }}
        run: |
          python -m pip install 'build>=1.2,<2'
          python -m build python/frameworks/agno --outdir "$RUNNER_TEMP/agno-dist"
          if [ "$DISTRIBUTION" = wheel ]; then
            artifact=$(find "$RUNNER_TEMP/agno-dist" -name '*.whl' -print -quit)
          else
            artifact=$(find "$RUNNER_TEMP/agno-dist" -name '*.tar.gz' -print -quit)
          fi
          python -m pip install "${artifact}[dev]" "agno==$AGNO_VERSION" 'openinference-instrumentation-agno==1.1.0'
          python -m pip check
      - name: Test with outbound network denied
        env:
          AGNO_TELEMETRY: 'false'
        run: |
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          python -I -m mypy --follow-imports=silent --ignore-missing-imports python/frameworks/agno/traceai_agno/_instrumentor.py
          # Pytest's default prepend mode otherwise imports the checkout, even with -I.
          python -I -m pytest python/frameworks/agno/tests --import-mode=importlib --require-installed-package -q
