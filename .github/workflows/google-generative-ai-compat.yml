name: Legacy Google Generative AI compatibility

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_google_genai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/tsconfig*.json'
      - '.github/workflows/google-generative-ai-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Legacy SDK ${{ matrix.sdk }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.1.0', '0.24.1']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          npm install --global pnpm@10.30.1
          pnpm --dir typescript --filter '@traceai/google-genai...' install --ignore-scripts --frozen-lockfile
      - name: Build, unit test and pack without outbound networking
        run: |
          policy="$GITHUB_WORKSPACE/typescript/packages/traceai_google_genai/test/network.sb"
          sandbox-exec -f "$policy" pnpm --dir typescript --filter '@traceai/google-genai...' run build
          sandbox-exec -f "$policy" pnpm --dir typescript --filter @traceai/google-genai test --runInBand
          sandbox-exec -f "$policy" pnpm --dir typescript/packages/traceai_google_genai pack --pack-destination "$RUNNER_TEMP/tarballs"
      - name: Install packed adapter with published dependencies and real SDKs
        env:
          LEGACY_SDK: ${{ matrix.sdk }}
        run: |
          tarball=$(find "$RUNNER_TEMP/tarballs" -name '*.tgz' -type f)
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund \
            "$tarball" "@google/generative-ai@$LEGACY_SDK" @google/genai@2.32.0 \
            @traceai/fi-core@1.1.0 @opentelemetry/sdk-trace-node@2.0.1 \
            @opentelemetry/sdk-trace-base@2.0.1 \
            @opentelemetry/exporter-trace-otlp-http@0.202.0 \
            @opentelemetry/exporter-trace-otlp-proto@0.202.0 \
            @opentelemetry/otlp-transformer@0.202.0
      - name: Verify real SDKs, README and OTLP payloads without outbound networking
        run: |
          export GENAI_TEST_CONSUMER="$RUNNER_TEMP/consumer"
          sandbox-exec -f typescript/packages/traceai_google_genai/test/network.sb \
            node --test typescript/packages/traceai_google_genai/test/compat.test.cjs
