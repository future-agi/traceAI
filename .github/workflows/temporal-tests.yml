name: Temporal compatibility

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/temporal/**'
      - '.github/workflows/temporal-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'python/frameworks/temporal/**'
      - '.github/workflows/temporal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compatibility:
    name: Temporal ${{ matrix.temporal }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            temporal: '1.34.0'
            otel: '1.39.0'
          - python: '3.13'
            temporal: '1.35.0'
            otel: '1.45.2'
    env:
      REQUIRE_TEMPORAL_INTEGRATION: '1'
      FI_BASE_URL: http://127.0.0.1:9
      FI_API_KEY: synthetic-api-key
      FI_SECRET_KEY: synthetic-secret-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and compatibility pins
        run: |
          python -m pip install './python/frameworks/temporal[dev]' \
            'fi-instrumentation-otel==1.2.2' 'temporalio[opentelemetry]==${{ matrix.temporal }}' \
            'opentelemetry-sdk==${{ matrix.otel }}' 'opentelemetry-exporter-otlp-proto-http==${{ matrix.otel }}'
      - name: Check public boundary types
        run: python -m mypy --follow-imports=silent --ignore-missing-imports python/frameworks/temporal/traceai_temporal
      - name: Install pinned Temporal dev server
        run: |
          mkdir -p "$RUNNER_TEMP/temporal-cli"
          curl --fail --location --retry 3 \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/temporal-cli/archive.tar.gz"
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $RUNNER_TEMP/temporal-cli/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/temporal-cli/archive.tar.gz" -C "$RUNNER_TEMP/temporal-cli" temporal
          echo "TEMPORAL_CLI=$RUNNER_TEMP/temporal-cli/temporal" >> "$GITHUB_ENV"
      - name: Test with outbound network disabled
        # Loopback remains available for Temporal and the synthetic OTLP receiver.
        # The rules live only inside a dedicated network namespace.
        run: |
          sudo unshare --net bash -c '
            ip link set lo up
            exec env REQUIRE_TEMPORAL_INTEGRATION=1 TEMPORAL_CLI="$3" "$1" -m pytest "$2" -q
          ' _ "$(command -v python)" "$GITHUB_WORKSPACE/python/frameworks/temporal/tests" "$TEMPORAL_CLI"
      - name: Build wheel and sdist
        run: python -m build python/frameworks/temporal
      - name: Test both distributions in fresh environments
        run: |
          for artifact in python/frameworks/temporal/dist/*.whl python/frameworks/temporal/dist/*.tar.gz; do
            env_dir=$(mktemp -d)
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install "$artifact" 'pytest>=8,<9' \
              'fi-instrumentation-otel==1.2.2' 'temporalio[opentelemetry]==${{ matrix.temporal }}' \
              'opentelemetry-sdk==${{ matrix.otel }}' 'opentelemetry-exporter-otlp-proto-http==${{ matrix.otel }}'
            sudo unshare --net bash -c '
              ip link set lo up
              exec env REQUIRE_TEMPORAL_INTEGRATION=1 TEMPORAL_CLI="$3" "$1" -I -m pytest "$2" -q
            ' _ "$env_dir/bin/python" "$GITHUB_WORKSPACE/python/frameworks/temporal/tests" "$TEMPORAL_CLI"
          done
