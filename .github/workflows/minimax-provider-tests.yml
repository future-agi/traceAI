name: MiniMax shared provider tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - 'python/tests/harness/**'
      - '.github/workflows/minimax-provider-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - 'python/tests/harness/**'
      - '.github/workflows/minimax-provider-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: MiniMax (${{ matrix.sdk }}, ${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            sdk: '1.69.0'
            core: source
          - python: '3.12'
            sdk: '3.42.0'
            core: source
          - python: '3.12'
            sdk: '3.42.0'
            core: released
    env:
      FI_BASE_URL: http://127.0.0.1:9
      FI_GRPC_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK and tracing packages
        env:
          SDK_VERSION: ${{ matrix.sdk }}
          CORE_MODE: ${{ matrix.core }}
        run: |
          python -m venv /tmp/minimax-test-venv
          /tmp/minimax-test-venv/bin/pip install 'pytest==8.4.2' pytest-asyncio 'httpx==0.27.2' \
            "openai==$SDK_VERSION" -e python/frameworks/openai
          if [ "$CORE_MODE" = source ]; then
            /tmp/minimax-test-venv/bin/pip install -e python
          else
            /tmp/minimax-test-venv/bin/pip install 'fi-instrumentation-otel==1.2.2'
          fi
      - name: Run with only loopback networking
        run: |
          sudo unshare --net -- bash -euc '
            ip link set lo up
            /tmp/minimax-test-venv/bin/python -I -m pytest python/frameworks/openai/tests -q
          '
