name: Mistral Python SDK tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'python/frameworks/mistralai/**'
      - 'python/tests/test_framework_mistralai.py'
      - '.github/workflows/mistralai-python-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/mistralai/**'
      - '.github/workflows/mistralai-python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: Mistral ${{ matrix.sdk }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', sdk: '1.1.0'}
          - {python: '3.12', sdk: '1.12.4'}
          - {python: '3.10', sdk: '3.6.0'}
          - {python: '3.13', sdk: '3.7.0'}
    env:
      FI_BASE_URL: http://127.0.0.1:9
      FI_GRPC_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the distribution
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          python -m venv .venv
          .venv/bin/pip install build poetry-core pytest==8.4.2 pytest-asyncio==0.24.0 pytest-mock==3.14.0
          .venv/bin/python -m build python/frameworks/mistralai --outdir dist
          .venv/bin/pip install dist/*.whl "mistralai==$SDK_VERSION"
          .venv/bin/pip check
      - name: Run SDK, README and OTLP contracts without outbound network
        run: |
          sudo unshare --net sh -c 'ip link set lo up; exec "$@"' sh \
            "$PWD/.venv/bin/python" -I -m pytest --noconftest \
            python/frameworks/mistralai/tests python/tests/test_framework_mistralai.py \
            -q -o asyncio_default_fixture_loop_scope=function
