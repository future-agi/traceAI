name: Graphite native adapter

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/grafi/**'
      - '.github/workflows/grafi-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/grafi/**'
      - '.github/workflows/grafi-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        otel: ['1.42.1', '1.45.2']
        distribution: ['wheel', 'sdist']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          OTEL_VERSION: ${{ matrix.otel }}
        run: |
          python -m pip install 'build>=1.2,<2' 'hatchling>=1.27,<2'
          python -m build python/frameworks/grafi --outdir "$RUNNER_TEMP/dist"
          if [ "$DISTRIBUTION" = wheel ]; then
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.whl' -print -quit)
          else
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.tar.gz' -print -quit)
          fi
          python -m pip install "${artifact}[dev]" "opentelemetry-sdk==$OTEL_VERSION" "opentelemetry-exporter-otlp-proto-http==$OTEL_VERSION"
          python -m pip check
      - name: Test with only loopback network available
        run: |
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          python -I -m pytest python/frameworks/grafi/tests -q
