name: OpenAI Vercel gateway tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_openai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/openai-vercel-gateway-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Vercel gateway OpenAI ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 7.x is a manual attribution probe, not expanded automatic-hook support.
        sdk: ['4.0.0', '5.23.2', '7.47.0']
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install pinned dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/openai... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/openai-sdk" --ignore-scripts --no-audit --no-fund "openai@${{ matrix.sdk }}"
      - name: Build package
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/openai run build
      - name: Install packed package for the qualified client types
        if: matrix.sdk == '5.23.2'
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-pack"
          pnpm --dir packages/traceai_openai pack --pack-destination "$RUNNER_TEMP/gateway-pack"
          npm install --prefix "$RUNNER_TEMP/openai-sdk" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/gateway-pack/*.tgz
          cp packages/traceai_openai/test/moduleTypes.mts packages/traceai_openai/test/moduleTypes.cts "$RUNNER_TEMP/openai-sdk/"
      - name: Network-isolated ESM and CommonJS type contracts
        if: matrix.sdk == '5.23.2'
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" node node_modules/typescript/bin/tsc --noEmit \
            --module NodeNext --moduleResolution NodeNext --target ES2022 --strict --skipLibCheck \
            "$RUNNER_TEMP/openai-sdk/moduleTypes.mts" "$RUNNER_TEMP/openai-sdk/moduleTypes.cts"
      - name: Network-isolated SDK and OTLP contracts
        env:
          OPENAI_TEST_SDK: ${{ runner.temp }}/openai-sdk/node_modules/openai
        run: |
          for hide in false true; do
            sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
              env PATH="$PATH" OPENAI_TEST_SDK="$OPENAI_TEST_SDK" \
              FI_HIDE_INPUTS="$hide" FI_HIDE_OUTPUTS="$hide" \
              FI_HIDE_LLM_INVOCATION_PARAMETERS="$hide" FI_HIDE_ERROR_DETAILS="$hide" \
              node --test packages/traceai_openai/test/vercelGateway.cjs
          done
      - name: Network-isolated locked SDK unit suite
        if: matrix.sdk == '5.23.2'
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" node packages/traceai_openai/node_modules/jest/bin/jest.js \
            --config packages/traceai_openai/jest.config.js --runInBand
