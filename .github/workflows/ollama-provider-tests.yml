name: OpenAI provider migrations

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/frameworks/vllm/**'
      - 'python/fi_instrumentation/**'
      - 'python/pyproject.toml'
      - '.github/workflows/ollama-provider-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/frameworks/vllm/**'
      - 'python/fi_instrumentation/**'
      - 'python/pyproject.toml'
      - '.github/workflows/ollama-provider-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider:
    name: Ollama and vLLM (OpenAI ${{ matrix.openai }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        openai: ['1.69.0', '3.42.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install SDK and test dependencies
        env:
          OPENAI_VERSION: ${{ matrix.openai }}
        run: >-
          python -m pip install -e python -e python/frameworks/openai -e python/frameworks/vllm
          "openai==$OPENAI_VERSION" 'pytest==8.4.2' 'pytest-asyncio==0.24.0' 'pytest-socket==0.7.0'
      - name: Test attribution over localhost OTLP
        env:
          FI_BASE_URL: http://127.0.0.1:9
          FI_GRPC_URL: http://127.0.0.1:9
        run: |
          sudo unshare --net -- bash -e -c '
            ip link set lo up
            "$1" -m pytest "$2/python/frameworks/openai/tests/test_ollama_provider.py" \
              "$2/python/frameworks/openai/tests/test_vllm_migration.py" \
              -q -o addopts="" -p no:cacheprovider --disable-socket \
              --allow-hosts=127.0.0.1 --allow-unix-socket
            "$1" -m pytest "$2/python/frameworks/vllm/tests" \
              -q -o addopts="" -p no:cacheprovider --disable-socket --allow-unix-socket
          ' _ "$(command -v python)" "$PWD"

  legacy:
    name: vLLM legacy (OpenAI 1.0.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install legacy package without the shared instrumentor
        run: >-
          python -m pip install -e python -e python/frameworks/vllm
          'openai==1.0.0' 'httpx==0.27.2' 'pytest==8.4.2'
          'pytest-asyncio==0.24.0' 'pytest-socket==0.7.0'
      - name: Test legacy SDK with outbound network disabled
        run: |
          sudo unshare --net -- bash -e -c '
            ip link set lo up
            "$1" -m pytest "$2/python/frameworks/vllm/tests" \
              -q -o addopts="" -p no:cacheprovider --disable-socket --allow-unix-socket
          ' _ "$(command -v python)" "$PWD"
