name: Ollama provider tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - 'python/pyproject.toml'
      - '.github/workflows/ollama-provider-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - 'python/pyproject.toml'
      - '.github/workflows/ollama-provider-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider:
    name: Ollama provider (OpenAI ${{ matrix.openai }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        openai: ['1.69.0', '3.42.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install SDK and test dependencies
        env:
          OPENAI_VERSION: ${{ matrix.openai }}
        run: >-
          python -m pip install -e python -e python/frameworks/openai
          "openai==$OPENAI_VERSION" 'pytest==8.4.2' 'pytest-socket==0.7.0'
      - name: Test attribution over localhost OTLP
        env:
          FI_BASE_URL: http://127.0.0.1:9
          FI_GRPC_URL: http://127.0.0.1:9
        run: >-
          python -m pytest python/frameworks/openai/tests/test_ollama_provider.py
          -q -o addopts='' -p no:cacheprovider --disable-socket
          --allow-hosts=127.0.0.1 --allow-unix-socket
