name: Aleph Alpha Python SDK tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/alephalpha/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/alephalpha-python-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/alephalpha/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/alephalpha-python-tests.yml'

permissions:
  contents: read

jobs:
  sdk-range:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            alephalpha: '7.6.0'
            artifact: wheel
          - python: '3.13'
            alephalpha: 'latest'
            artifact: sdist
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the package
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          ALEPHALPHA_VERSION: ${{ matrix.alephalpha }}
        run: |
          python -m venv .alephalpha-test-venv
          .alephalpha-test-venv/bin/pip install build
          .alephalpha-test-venv/bin/python -m build "--$ARTIFACT" python/frameworks/alephalpha
          if [ "$ARTIFACT" = wheel ]; then ext='*.whl'; else ext='*.tar.gz'; fi
          if [ "$ALEPHALPHA_VERSION" = latest ]; then sdk='aleph-alpha-client'; else sdk="aleph-alpha-client==$ALEPHALPHA_VERSION"; fi
          .alephalpha-test-venv/bin/pip install python/frameworks/alephalpha/dist/$ext "$sdk" pytest pytest-asyncio
      - name: Run offline tests without external traffic
        shell: bash
        run: |
          sudo unshare --net bash -c '
            set -e
            ip link set lo up
            "$1" -I -m pytest python/frameworks/alephalpha/tests -q -p no:cacheprovider
          ' _ "$PWD/.alephalpha-test-venv/bin/python"
