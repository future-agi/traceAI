# One sequential worker builds exact tarballs, verifies fresh installs with local
# workspace dependencies, then publishes in DAG order. No dependency can race its
# consumer (including Vercel -> Mastra). Credentials exist only in the delivery step.
name: Release (TypeScript packages)

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of dependency-ordered release planner entries
        type: string
        required: true
      publish:
        description: Publish to npm, tag and create GitHub releases (false = build and check only)
        type: boolean
        required: true

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: TypeScript packages in dependency order
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGES: ${{ inputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Where the distributions go
        run: echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install the workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and pack targets plus their transitive workspace dependencies
        run: python3 .github/release/npm_release.py stage --packages "$PACKAGES" --dist "$DIST"
      - name: Clean-install exact staged tarballs and load each target (CJS and ESM)
        run: python3 .github/release/npm_release.py verify --packages "$PACKAGES" --dist "$DIST" --smoke "$RUNNER_TEMP/smoke"
      - name: Keep the tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/dist/**/*.tgz
          if-no-files-found: error
      - name: Not publishing
        if: inputs.publish != true
        run: echo "::notice::npm packages built and checked only (publishing is off or this is a dry run)"
      - name: Use npm 11 (trusted publishing needs npm 11.5.1 or later)
        if: inputs.publish
        # npm tries OIDC trusted publishing first and falls back to NODE_AUTH_TOKEN, so this
        # works with the token today and with trusted publishers once they are configured.
        run: npm install -g npm@11.21.1 && npm --version
      - name: Publish, wait for public availability, then tag and release (dependency-first)
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release/npm_release.py publish --packages "$PACKAGES" --dist "$DIST"
