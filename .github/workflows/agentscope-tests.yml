name: AgentScope adapter

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/agentscope/**'
      - '.github/workflows/agentscope-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/agentscope/**'
      - '.github/workflows/agentscope-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        agentscope: ['2.0.10', '2.0.11', 'latest']
        distribution: ['wheel', 'sdist']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions and install an artifact
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          AGENTSCOPE_VERSION: ${{ matrix.agentscope }}
        run: |
          python -m pip install 'build>=1.2,<2' 'hatchling>=1.27,<2'
          python -m build python/frameworks/agentscope --outdir "$RUNNER_TEMP/dist"
          if [ "$DISTRIBUTION" = wheel ]; then
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.whl' -print -quit)
          else
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.tar.gz' -print -quit)
          fi
          if [ "$AGENTSCOPE_VERSION" = latest ]; then
            python -m pip install "${artifact}[dev]" 'agentscope>=2.0.10,<2.1'
          else
            python -m pip install "${artifact}[dev]" "agentscope==$AGENTSCOPE_VERSION"
          fi
      - name: Test without outbound network
        run: |
          # Dependencies are installed above. Only loopback remains available for OTLP.
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          python -I -m mypy --config-file python/frameworks/agentscope/pyproject.toml python/frameworks/agentscope/traceai_agentscope
          python -I -m pytest python/frameworks/agentscope/tests -q
