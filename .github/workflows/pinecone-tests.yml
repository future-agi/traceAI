name: Pinecone transport contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/pinecone/**'
      - '.github/workflows/pinecone-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/pinecone/**'
      - '.github/workflows/pinecone-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Pinecone (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # SDK 3 has no asyncio client. Its optional grpc extra pins protobuf 3,
          # incompatible with the core's OTel dependency. Exercise its REST floor.
          - sdk: '3.0.0'
            requirement: 'pinecone==3.0.0'
          - sdk: '7.3.0'
            requirement: 'pinecone[grpc,asyncio]==7.3.0'
          - sdk: '10.2.0'
            requirement: 'pinecone==10.2.0'
    env:
      FI_BASE_URL: http://127.0.0.1:9
      FI_GRPC_URL: http://127.0.0.1:9
      SDK_REQUIREMENT: ${{ matrix.requirement }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact SDK and package
        run: |
          python -m pip install "$SDK_REQUIREMENT" ./python/frameworks/pinecone pytest pytest-asyncio
          python -m pip check
      - name: Test with outbound network disabled
        run: |
          sudo unshare --net bash -c '
            ip link set lo up
            exec env PINECONE_REQUIRE_TRANSPORTS=1 "$1" -I -m pytest "$2" -q -rs
          ' _ "$(command -v python)" "$GITHUB_WORKSPACE/python/frameworks/pinecone/tests"
