name: Portkey TypeScript tests

on:
  pull_request:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_portkey/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/portkey-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_portkey/**'
      - '.github/workflows/portkey-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Portkey offline (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install frozen dependencies without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/portkey... install --frozen-lockfile --ignore-scripts
      - name: Build public entries
        run: pnpm --filter @traceai/portkey... run build
      - name: SDK matrix, automatic hooks, and OTLP privacy without outbound network
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up; exec "$@"' sh \
            "$(command -v node)" node_modules/jest/bin/jest.js \
            --config packages/traceai_portkey/jest.config.js --runInBand
      - name: Check lockfile stability
        run: git diff --exit-code -- pnpm-lock.yaml
