name: Cognee native tracing adapter

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/cognee/**'
      - 'python/examples/cognee/**'
      - 'python/tests/harness/**'
      - '.github/workflows/cognee-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/cognee/**'
      - 'python/examples/cognee/**'
      - 'python/tests/harness/**'
      - '.github/workflows/cognee-tests.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cognee: ['1.6.5', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install adapter and real Cognee
        env:
          COGNEE_VERSION: ${{ matrix.cognee }}
        run: |
          python -m pip install './python/frameworks/cognee[dev]'
          if [ "$COGNEE_VERSION" = latest ]; then
            python -m pip install --upgrade 'cognee[tracing]'
          else
            python -m pip install "cognee[tracing]==$COGNEE_VERSION"
          fi
          python -m pip check
      - name: Test with loopback only
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          python -I -m pytest --noconftest python/frameworks/cognee/tests python/examples/cognee/tests -q
