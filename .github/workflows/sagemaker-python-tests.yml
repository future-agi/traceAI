name: SageMaker Python tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/sagemaker/**'
      - 'python/frameworks/bedrock/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/sagemaker-python-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/sagemaker/**'
      - 'python/frameworks/bedrock/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/sagemaker-python-tests.yml'

permissions:
  contents: read

jobs:
  boto3-range:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            boto3: '1.34.0'
            artifact: wheel
          - python: '3.13'
            boto3: 'latest'
            artifact: sdist
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install packages
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BOTO3_VERSION: ${{ matrix.boto3 }}
        run: |
          python -m venv .sagemaker-test-venv
          .sagemaker-test-venv/bin/pip install build
          for pkg in sagemaker bedrock; do
            .sagemaker-test-venv/bin/python -m build "--$ARTIFACT" "python/frameworks/$pkg"
          done
          if [ "$ARTIFACT" = wheel ]; then ext='*.whl'; else ext='*.tar.gz'; fi
          if [ "$BOTO3_VERSION" = latest ]; then boto3_spec='boto3'; else boto3_spec="boto3==$BOTO3_VERSION"; fi
          .sagemaker-test-venv/bin/pip install python/frameworks/sagemaker/dist/$ext "$boto3_spec" pytest dacite
          # The bedrock package declares a newer boto3 floor than this package; it is installed
          # without dependencies so the coexistence tests also run at the oldest supported boto3.
          .sagemaker-test-venv/bin/pip install --no-deps python/frameworks/bedrock/dist/$ext
      - name: Run offline tests without external traffic
        shell: bash
        run: |
          sudo unshare --net bash -c '
            set -e
            ip link set lo up
            "$1" -I -m pytest python/frameworks/sagemaker/tests python/frameworks/bedrock/tests \
              -q -p no:cacheprovider
          ' _ "$PWD/.sagemaker-test-venv/bin/python"
