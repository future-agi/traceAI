name: Google ADK TypeScript tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_google_adk/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/google-adk-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-adk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adk: ['0.1.0', '2.4.0']
        capture: ['0', '1']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install workspace and isolated ADK runtime
        working-directory: typescript
        env:
          ADK_VERSION: ${{ matrix.adk }}
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/fi-instrumentation-google-adk... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/adk" --ignore-scripts --no-audit --no-fund "@google/adk@$ADK_VERSION"
      - name: Build package and dependencies
        working-directory: typescript
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/fi-instrumentation-google-adk build
      - name: Unit, compatibility and real ADK OTLP tests without outbound network
        env:
          CAPTURE: ${{ matrix.capture }}
        run: |
          sudo unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            "$4" "$1/typescript/node_modules/jest/bin/jest.js" --config "$1/typescript/packages/traceai_google_adk/jest.config.js" --runInBand
            "$4" --test "$1/typescript/packages/traceai_google_adk/test/native.test.cjs" "$1/typescript/packages/traceai_google_adk/test/native-privacy.test.cjs" "$1/typescript/packages/traceai_google_adk/test/native-errors.test.cjs"
            ADK_RUNTIME="$2" CAPTURE_CONTENT="$3" "$4" "$1/typescript/packages/traceai_google_adk/test/run-adk.cjs"
            if [ "$5" = "2.4.0" ] && [ "$3" = "1" ]; then
              for mode in default stream audio audio-capture audio-stream audio-stream-capture tool-error tool-error-hide provider-error provider-error-stream; do
                "$4" "$1/typescript/packages/traceai_google_adk/test/native-http.cjs" "$1/typescript/packages/traceai_google_adk" "$2" "$mode"
              done
              for mode in audio-output audio-output-capture audio-output-stream audio-output-stream-capture image-output image-output-capture image-output-stream image-output-stream-capture; do
                for flag in "" FI_HIDE_OUTPUTS FI_HIDE_OUTPUT_MESSAGES FI_HIDE_OUTPUT_TEXT FI_PII_REDACTION; do
                  "$4" "$1/typescript/packages/traceai_google_adk/test/native-http.cjs" "$1/typescript/packages/traceai_google_adk" "$2" "$mode" "$flag"
                done
              done
              for mode in tool-usage tool-usage-capture tool-usage-stream tool-usage-stream-capture; do
                for flag in "" FI_HIDE_INPUTS FI_HIDE_INPUT_MESSAGES FI_HIDE_INPUT_TEXT FI_HIDE_OUTPUTS FI_HIDE_OUTPUT_MESSAGES FI_HIDE_OUTPUT_TEXT FI_PII_REDACTION; do
                  "$4" "$1/typescript/packages/traceai_google_adk/test/native-http.cjs" "$1/typescript/packages/traceai_google_adk" "$2" "$mode" "$flag"
                done
              done
              for mode in default credentials credential-variants hide-inputs hide-outputs hide-input-text hide-output-text hide-input-messages hide-output-messages pii numeric-pii; do
                "$4" "$1/typescript/packages/traceai_google_adk/test/native-privacy-wire.cjs" "$1/typescript/packages/traceai_google_adk" "$2" "$mode"
              done
            fi
          ' -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP/adk" "$CAPTURE" "$(command -v node)" "${{ matrix.adk }}"
      - name: Pack public entry points
        working-directory: typescript/packages/traceai_google_adk
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          git diff --exit-code -- ../../pnpm-lock.yaml
      - name: Test independently installed packages with real HTTP clients
        if: matrix.adk == '2.4.0' && matrix.capture == '1'
        working-directory: typescript
        run: |
          for package in fi-core fi-semantic-conventions; do
            (cd "packages/$package" && pnpm pack --pack-destination "$RUNNER_TEMP/package")
          done
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/package/"*.tgz @google/adk@2.4.0
          cp packages/traceai_google_adk/test/native-plugin.types.ts "$RUNNER_TEMP/consumer/"
          node node_modules/typescript/bin/tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext "$RUNNER_TEMP/consumer/native-plugin.types.ts"
          sudo unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            for mode in default stream audio audio-capture audio-stream audio-stream-capture tool-error tool-error-hide provider-error provider-error-stream; do
              "$3" "$1/typescript/packages/traceai_google_adk/test/native-http.cjs" "$2/node_modules/@traceai/fi-instrumentation-google-adk" "$2" "$mode"
            done
            for mode in audio-output audio-output-capture audio-output-stream audio-output-stream-capture image-output image-output-capture image-output-stream image-output-stream-capture; do
              for flag in "" FI_HIDE_OUTPUTS FI_HIDE_OUTPUT_MESSAGES FI_HIDE_OUTPUT_TEXT FI_PII_REDACTION; do
                "$3" "$1/typescript/packages/traceai_google_adk/test/native-http.cjs" "$2/node_modules/@traceai/fi-instrumentation-google-adk" "$2" "$mode" "$flag"
              done
            done
            for mode in tool-usage tool-usage-capture tool-usage-stream tool-usage-stream-capture; do
              for flag in "" FI_HIDE_INPUTS FI_HIDE_INPUT_MESSAGES FI_HIDE_INPUT_TEXT FI_HIDE_OUTPUTS FI_HIDE_OUTPUT_MESSAGES FI_HIDE_OUTPUT_TEXT FI_PII_REDACTION; do
                "$3" "$1/typescript/packages/traceai_google_adk/test/native-http.cjs" "$2/node_modules/@traceai/fi-instrumentation-google-adk" "$2" "$mode" "$flag"
              done
            done
          ' -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP/consumer" "$(command -v node)"
