name: C# SDK CI

on:
  pull_request:
    paths:
      - 'csharp/**'
      # The startup hook ships byte copies of the shared privacy catalog and
      # replays every shared wire fixture.
      - 'spec/auto-instrumentation/**'
      - '.github/workflows/csharp-ci.yml'
      # The hook package check runs here and in the release build.
      - '.github/release/check_startup_hook_package.sh'
      - '.github/workflows/release-nuget.yml'
  push:
    branches: [dev, main]
    paths:
      - 'csharp/**'
      - 'spec/auto-instrumentation/**'
      - '.github/workflows/csharp-ci.yml'
      - '.github/release/check_startup_hook_package.sh'
      - '.github/workflows/release-nuget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: .NET 10 / OpenTelemetry ${{ matrix.otel }}
    # GitHub stopped accepting macos-14 on 2026-11-05; macos-15 runs the same
    # loopback-only sandbox profile in guardrails-typescript-tests.yml.
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - otel: '1.11.2'
            # The startup hook pins its own OpenTelemetry and ignores this version, so its
            # child-process suite runs once on macOS (the other leg) and in the Linux job.
            tests: csharp/tests/FIInstrumentation.Tests/FIInstrumentation.Tests.csproj
          - otel: '1.20.1'
            tests: csharp/FIInstrumentation.sln
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      # Keep vstest's IPC on IPv4 loopback, which the sandbox allows.
      DOTNET_SYSTEM_NET_DISABLEIPV6: '1'
      OTEL_VERSION: ${{ matrix.otel }}
      TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # The startup hook tests launch real .NET 8 and .NET 10 child processes.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Point child-process tests at the installed runtimes
        run: echo "DOTNET_HOST_PATH=$DOTNET_ROOT/dotnet" >> "$GITHUB_ENV"
      - name: Restore dependencies
        run: dotnet restore csharp/FIInstrumentation.sln -p:OpenTelemetryVersion="$OTEL_VERSION"
      - name: Build
        # One node: the startup hook tests also build their net8.0 child apps, which
        # the solution builds too; never build the same outputs concurrently.
        run: |
          dotnet build csharp/FIInstrumentation.sln --no-restore --configuration Release -m:1 \
            -p:OpenTelemetryVersion="$OTEL_VERSION"
      - name: Test without outbound network
        run: |
          cat > "$RUNNER_TEMP/offline.sb" <<'SANDBOX'
          (version 1)
          (allow default)
          (deny network-outbound)
          (allow network-outbound (remote ip "localhost:*"))
          (allow network-outbound (remote unix-socket))
          SANDBOX
          sandbox-exec -f "$RUNNER_TEMP/offline.sb" dotnet test "$TESTS" \
            --no-build --configuration Release -p:OpenTelemetryVersion="$OTEL_VERSION" \
            --logger 'trx;LogFilePrefix=tests' --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csharp-tests-otel-${{ matrix.otel }}
          path: TestResults/*.trx
          if-no-files-found: warn

  startup-hook-linux:
    name: Startup hook / Linux / .NET 8 and 10
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Point child-process tests at the installed runtimes
        run: echo "DOTNET_HOST_PATH=$DOTNET_ROOT/dotnet" >> "$GITHUB_ENV"
      - name: Test the startup hook (wire fixtures, privacy catalog, .NET 8 and 10 child processes)
        run: |
          dotnet test csharp/tests/TraceAI.AutoInstrumentation.Tests/TraceAI.AutoInstrumentation.Tests.csproj \
            --configuration Release --logger 'trx;LogFilePrefix=startup-hook' --results-directory TestResults
      - name: Pack the startup hook
        run: |
          dotnet pack csharp/src/TraceAI.AutoInstrumentation/TraceAI.AutoInstrumentation.csproj \
            --configuration Release --output "$RUNNER_TEMP/hook-feed"
      - name: Check the installed startup hook package (.NET 8 and 10 applications, real span delivery)
        run: bash .github/release/check_startup_hook_package.sh "$RUNNER_TEMP/hook-feed"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csharp-startup-hook-linux
          path: TestResults/*.trx
          if-no-files-found: warn
