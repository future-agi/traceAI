name: Baseten Python contracts

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - 'python/examples/baseten/**'
      - 'python/tests/harness/**'
      - '.github/workflows/baseten-python-contracts.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - 'python/examples/baseten/**'
      - 'python/tests/harness/**'
      - '.github/workflows/baseten-python-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Baseten OpenAI ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['1.69.0', 'latest']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDK_VERSION: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install source packages and the selected SDK
        run: |
          sdk=openai
          if [ "$SDK_VERSION" != latest ]; then sdk="openai==$SDK_VERSION"; fi
          python -m pip install -e python -e python/frameworks/openai "$sdk" httpx pytest
          python -c 'import openai; print("Resolved OpenAI SDK:", openai.__version__)'
      - name: Run network-isolated provider and recipe contracts
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest python/frameworks/openai/tests/test_baseten_provider.py \
            python/frameworks/openai/tests/test_openai_compatible_spans.py \
            python/frameworks/openai/tests/test_stream_lifecycle.py \
            python/frameworks/openai/tests/test_stream_context_manager.py \
            --noconftest -p no:cacheprovider -o addopts='' -q
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="python/examples/baseten/src:python/tests" \
            python -m pytest python/examples/baseten/tests \
            --noconftest -p no:cacheprovider -o addopts='' -q
