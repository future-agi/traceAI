name: Harbor adapter

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/harbor/**'
      - '.github/workflows/harbor-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/harbor/**'
      - '.github/workflows/harbor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        distribution: ['wheel', 'sdist']
        dependencies: ['floor', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and independently install a distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          python -m pip install 'build>=1.2,<2' 'hatchling>=1.27,<2'
          python -m build python/frameworks/harbor --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/test-venv"
          if [ "$DISTRIBUTION" = wheel ]; then
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.whl' -print -quit)
          else
            artifact=$(find "$RUNNER_TEMP/dist" -name '*.tar.gz' -print -quit)
          fi
          if [ "$DEPENDENCIES" = floor ]; then
            "$RUNNER_TEMP/test-venv/bin/pip" install "${artifact}[dev]" 'opentelemetry-proto==1.42.1' 'httpx==0.28.1'
          else
            "$RUNNER_TEMP/test-venv/bin/pip" install "${artifact}[dev]"
          fi
          # Harbor minimum and current are both 0.25.0; converter is pinned 0.1.1.
          "$RUNNER_TEMP/test-venv/bin/pip" check
      - name: Exercise installed package with outbound traffic denied
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          HARBOR_TELEMETRY: 'false'
        run: |
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/test-venv/bin/python" -I -m pytest --confcutdir="$GITHUB_WORKSPACE/python/frameworks/harbor/tests" "$GITHUB_WORKSPACE/python/frameworks/harbor/tests" -q
