name: TypeSafe TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_typesafe/**'
      - 'typescript/packages/traceai_auto/src/integrations.json'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/pnpm-workspace.yaml'
      - 'typescript/package.json'
      - '.github/workflows/typesafe-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typesafe:
    name: TypeSafe SDK 0.5.7 and 0.7.0 / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - name: Frozen filtered install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '@traceai/typesafe...'
      - name: Build CJS and ESM with shared dependencies
        run: pnpm --filter '@traceai/typesafe...' --workspace-concurrency=1 run build
      - name: Offline SDK contracts
        # A separate network namespace has only loopback: the tests use a fake fetch and must
        # never reach a vendor endpoint.
        run: |
          sudo --preserve-env=PATH unshare --net bash -c '
            ip link set lo up
            node node_modules/jest/bin/jest.js --config packages/traceai_typesafe/jest.config.js --runInBand
          '
