name: Vertex AI TypeScript compatibility

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_vertexai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/tsconfig*.json'
      - '.github/workflows/vertexai-typescript-tests.yml'

permissions:
  contents: read

jobs:
  compatibility:
    name: Vertex SDK ${{ matrix.sdk }} / Node ${{ matrix.node }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['1.0.0', '1.12.0']
        node: ['18.19.0', '22.15.0', '26.8.1']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.15.0'
      - name: Install frozen build dependencies
        run: |
          npm install --global pnpm@10.30.1
          pnpm --dir typescript --filter '@traceai/fi-instrumentation-vertexai...' install --ignore-scripts --frozen-lockfile
      - name: Build, unit test and pack without outbound networking
        run: |
          policy="$GITHUB_WORKSPACE/typescript/packages/traceai_vertexai/test/network.sb"
          sandbox-exec -f "$policy" pnpm --dir typescript --filter '@traceai/fi-instrumentation-vertexai...' run build
          sandbox-exec -f "$policy" pnpm --dir typescript --filter @traceai/fi-instrumentation-vertexai test --runInBand
          sandbox-exec -f "$policy" pnpm --dir typescript/packages/traceai_vertexai pack --pack-destination "$RUNNER_TEMP/tarballs"
          sandbox-exec -f "$policy" python3 -I .github/release/release_plan.py --check
      - name: Install packed adapter with registry dependencies and real SDK
        env:
          VERTEX_SDK: ${{ matrix.sdk }}
        run: |
          tarball=$(find "$RUNNER_TEMP/tarballs" -name '*.tgz' -type f)
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund \
            "$tarball" "@google-cloud/vertexai@$VERTEX_SDK"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify real SDK, README and OTLP payloads without outbound networking
        run: |
          export VERTEX_CONSUMER="$RUNNER_TEMP/consumer"
          export VERTEX_INSTRUMENTATION="$VERTEX_CONSUMER/node_modules/@traceai/fi-instrumentation-vertexai"
          sandbox-exec -f typescript/packages/traceai_vertexai/test/network.sb \
            node --test typescript/packages/traceai_vertexai/test/compat.test.cjs \
            typescript/packages/traceai_vertexai/test/export.test.cjs \
            typescript/packages/traceai_vertexai/test/readme.test.cjs
