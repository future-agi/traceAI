name: Release (RubyGems)
on:
  workflow_call:
    inputs:
      packages:
        type: string
        required: true
      publish:
        type: boolean
        required: true
    secrets:
      RUBYGEMS_API_KEY:
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  gem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.packages) }}
    env:
      NAME: ${{ matrix.name }}
      VERSION: ${{ matrix.version }}
      DIR: ${{ matrix.dir }}
      TAG: ${{ matrix.tag }}
      CHANGELOG: ${{ matrix.changelog }}
      REGISTRY_PUBLISHED: ${{ matrix.registry_published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build gem and verify local install
        run: |
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/local-gems"
          (cd "$DIR" && gem build "$NAME.gemspec" --output "$RUNNER_TEMP/dist/$NAME-$VERSION.gem")
          GEM_HOME="$RUNNER_TEMP/local-gems" GEM_PATH="$RUNNER_TEMP/local-gems" gem install openai --version 0.115.0 --no-document
          GEM_HOME="$RUNNER_TEMP/local-gems" GEM_PATH="$RUNNER_TEMP/local-gems" gem install opentelemetry-api --no-document
          GEM_HOME="$RUNNER_TEMP/local-gems" GEM_PATH="$RUNNER_TEMP/local-gems" gem install --local "$RUNNER_TEMP/dist/$NAME-$VERSION.gem" --no-document
          GEM_HOME="$RUNNER_TEMP/local-gems" GEM_PATH="$RUNNER_TEMP/local-gems" ruby -e "require 'traceai/openai'; abort 'wrong version' unless TraceAI::OpenAI::VERSION == ENV.fetch('VERSION')"
      - name: Publish to RubyGems
        if: inputs.publish && !matrix.registry_published
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          test -n "$GEM_HOST_API_KEY" || { echo '::error::Configure RUBYGEMS_API_KEY before publishing'; exit 1; }
          gem push "$RUNNER_TEMP/dist/$NAME-$VERSION.gem"
      - name: Verify public RubyGems availability
        if: inputs.publish
        run: |
          mkdir -p "$RUNNER_TEMP/registry-gems"
          for attempt in $(seq 1 20); do
            if GEM_HOME="$RUNNER_TEMP/registry-gems" GEM_PATH="$RUNNER_TEMP/registry-gems" gem install "$NAME" --version "$VERSION" --no-document --clear-sources --source https://rubygems.org; then exit 0; fi
            echo "attempt $attempt: $NAME $VERSION not served yet"
            sleep 30
          done
          echo "::error::RubyGems has not served $NAME $VERSION after ten minutes; rerun Release"
          exit 1
      - name: Tag and create GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release/github_release.py --install "gem install $NAME -v $VERSION" --dist "$RUNNER_TEMP/dist"
