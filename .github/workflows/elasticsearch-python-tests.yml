name: Elasticsearch Python SDK contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/elasticsearch/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/elasticsearch-python-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/elasticsearch/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/elasticsearch-python-tests.yml'

permissions:
  contents: read

jobs:
  sdk-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            elasticsearch: '8.19.3'
            artifact: wheel
          - python: '3.13'
            elasticsearch: '9.5.1'
            artifact: sdist
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install packages
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          ELASTICSEARCH_VERSION: ${{ matrix.elasticsearch }}
        run: |
          python -m venv .elasticsearch-test-venv
          .elasticsearch-test-venv/bin/pip install build
          .elasticsearch-test-venv/bin/python -m build "--$ARTIFACT" python/frameworks/elasticsearch
          if [ "$ARTIFACT" = wheel ]; then
            packages=(python/frameworks/elasticsearch/dist/*.whl)
          else
            packages=(python/frameworks/elasticsearch/dist/*.tar.gz)
          fi
          .elasticsearch-test-venv/bin/pip install "${packages[@]}" \
            "elasticsearch==$ELASTICSEARCH_VERSION" pytest pytest-asyncio numpy
      - name: Run SDK tests without external traffic
        shell: bash
        run: |
          sudo unshare --net bash -c '
            set -e
            ip link set lo up
            "$1" -I -m pytest python/frameworks/elasticsearch/tests \
              -q -p no:cacheprovider
          ' _ "$PWD/.elasticsearch-test-venv/bin/python"
