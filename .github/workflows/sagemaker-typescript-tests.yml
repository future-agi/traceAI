name: SageMaker TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_sagemaker/**'
      - 'typescript/packages/traceai_auto/src/integrations.json'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/pnpm-workspace.yaml'
      - 'typescript/package.json'
      - '.github/workflows/sagemaker-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sagemaker:
    name: SageMaker Runtime client 3.693.0 and 3.1127.0 / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - name: Frozen filtered install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '@traceai/sagemaker...'
      - name: Build CJS and ESM with shared dependencies
        run: pnpm --filter '@traceai/sagemaker...' --workspace-concurrency=1 run build
      - name: Offline SDK contracts
        # A separate network namespace has only loopback: the tests use a canned client responses and must
        # never reach a vendor endpoint.
        run: |
          sudo --preserve-env=PATH unshare --net bash -c '
            ip link set lo up
            node node_modules/jest/bin/jest.js --config packages/traceai_sagemaker/jest.config.js --runInBand
          '
