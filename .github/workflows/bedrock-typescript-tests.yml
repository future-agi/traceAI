name: Bedrock TypeScript tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_bedrock/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/bedrock-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_bedrock/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/bedrock-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Bedrock SDK ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.693.0', '3.1161.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies and the matrix SDK
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          pnpm --dir typescript --filter '@traceai/bedrock...' install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/bedrock-sdk" --ignore-scripts --no-audit --no-fund "@aws-sdk/client-bedrock-runtime@$SDK_VERSION"
          ln -sfn "$RUNNER_TEMP/bedrock-sdk/node_modules/@aws-sdk/client-bedrock-runtime" typescript/packages/traceai_bedrock/node_modules/@aws-sdk/client-bedrock-runtime
      - name: Build all module formats
        run: pnpm --dir typescript --filter '@traceai/bedrock...' run build
      - name: Test with only loopback networking
        run: |
          sudo unshare --net bash -c '
            ip link set lo up
            exec runuser -u "$1" -- env PATH="$2" "$3" --dir "$4" test --runInBand
          ' _ "$(id -un)" "$PATH" "$(command -v pnpm)" "$PWD/typescript/packages/traceai_bedrock"
