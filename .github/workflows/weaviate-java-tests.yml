name: Weaviate Java compatibility

on:
  pull_request:
    paths:
      - 'java/traceai-java-weaviate/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/weaviate-java-tests.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/traceai-java-weaviate/**'
      - 'java/traceai-java-core/**'
      - 'java/pom.xml'
      - '.github/workflows/weaviate-java-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Client ${{ matrix.client }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        client: ['6.0.0', '6.3.2']
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test real SDK over loopback and decode OTLP
        run: >-
          mvn -B -ntp -f java/pom.xml -pl traceai-java-weaviate -am
          -Dweaviate6.version=${{ matrix.client }}
          '-Dtest=TracedWeaviateV6Test,WeaviateOtlpWireTest,WeaviateTracingTest'
          -Dsurefire.failIfNoSpecifiedTests=false verify
      - name: Package against the minimum client for binary compatibility
        run: >-
          mvn -B -ntp -f java/pom.xml -pl traceai-java-weaviate -am
          -Dweaviate6.version=6.0.0 -DskipTests clean install
      - name: Prepare standalone consumers with only one SDK each
        run: >-
          python3 -I java/traceai-java-weaviate/scripts/prepare_consumers.py
          --output "${{ runner.temp }}/weaviate-consumers"
          --client-version ${{ matrix.client }}
      - name: Run README against the packaged JAR and check legacy isolation
        run: |
          mvn -B -ntp -f "${{ runner.temp }}/weaviate-consumers/v6/pom.xml" test
          mvn -B -ntp -f "${{ runner.temp }}/weaviate-consumers/legacy/pom.xml" test
