name: OpenAI SDK contracts

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_openai/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/traceai_provider_media/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/openai-sdk-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: OpenAI SDK ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['4.0.0', '5.23.2', '6.0.0', '7.0.0', '7.47.0', 'latest']
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install pinned workspace dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/openai... install --frozen-lockfile --ignore-scripts
      - name: Build and install the tarball in a clean consumer
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/openai run build
          pnpm --dir packages/traceai_openai pack --out "$RUNNER_TEMP/openai.tgz"
          pnpm --dir packages/fi-core pack --out "$RUNNER_TEMP/core.tgz"
          pnpm --dir packages/traceai_provider_media pack --out "$RUNNER_TEMP/provider-media.tgz"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP/openai.tgz" "openai@${{ matrix.sdk }}" \
            "$RUNNER_TEMP/core.tgz" "$RUNNER_TEMP/provider-media.tgz" @traceai/fi-semantic-conventions@1.0.0 \
            @opentelemetry/sdk-trace-base@2.0.1 @opentelemetry/context-async-hooks@2.0.1 \
            @opentelemetry/exporter-trace-otlp-http@0.202.0 \
            @opentelemetry/exporter-trace-otlp-proto@0.202.0 @opentelemetry/otlp-transformer@0.202.0 \
            typescript@5.8.3 @types/node@22.15.29
      - name: Install a non-hoisted package consumer
        run: |
          mkdir -p "$RUNNER_TEMP/strict-consumer"
          cat > "$RUNNER_TEMP/strict-consumer/package.json" <<JSON
          {"private":true,"dependencies":{"@traceai/openai":"file:$RUNNER_TEMP/openai.tgz","openai":"${{ matrix.sdk }}"},"pnpm":{"overrides":{"@traceai/fi-core":"file:$RUNNER_TEMP/core.tgz","@traceai/provider-media":"file:$RUNNER_TEMP/provider-media.tgz"}}}
          JSON
          pnpm --dir "$RUNNER_TEMP/strict-consumer" install --ignore-scripts \
            --config.hoist=false --config.shamefully-hoist=false
      - name: Network-isolated non-hoisted imports
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_STRICT_CONSUMER_DIR="$RUNNER_TEMP/strict-consumer" \
            node --test packages/traceai_openai/test/strictImports.cjs
      - name: Network-isolated automatic and manual SDK contracts
        env:
          OPENAI_CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: |
          for format in json proto; do
            for gzip in false true; do
              for manual in false true; do
                sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
                  env PATH="$PATH" OPENAI_CONSUMER_DIR="$OPENAI_CONSUMER_DIR" \
                  OTLP_TEST_FORMAT="$format" OTLP_TEST_GZIP="$gzip" OPENAI_TEST_MANUAL="$manual" \
                  node --test packages/traceai_openai/test/currentSdk.cjs
              done
            done
          done
      - name: Network-isolated recall regressions
        env:
          OPENAI_CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_CONSUMER_DIR="$OPENAI_CONSUMER_DIR" \
            node --test packages/traceai_openai/test/recallRegressions.cjs \
              packages/traceai_openai/test/privacyContext.cjs \
              packages/traceai_openai/test/reviewRegressions.cjs \
              packages/traceai_openai/test/reviewRoundTwo.cjs \
              packages/traceai_openai/test/reviewRoundThree.cjs \
              packages/traceai_openai/test/choiceIndexes.cjs \
              packages/traceai_openai/test/mixedImports.cjs
      - name: Typecheck current SDK request contracts
        if: matrix.sdk == '7.47.0'
        env:
          OPENAI_CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: |
          cp packages/traceai_openai/test/currentSdkShapes.mts "$OPENAI_CONSUMER_DIR/"
          "$OPENAI_CONSUMER_DIR/node_modules/.bin/tsc" --noEmit --module nodenext --target es2022 \
            "$OPENAI_CONSUMER_DIR/currentSdkShapes.mts"
      - name: Network-isolated promise and provider regressions
        env:
          OPENAI_SDK_PATH: ${{ runner.temp }}/consumer/node_modules/openai
          OPENAI_TEST_MODULE: ${{ runner.temp }}/consumer/node_modules/openai
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_SDK_PATH="$OPENAI_SDK_PATH" \
            node --test packages/traceai_openai/test/apiPromise.cjs
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_TEST_MODULE="$OPENAI_TEST_MODULE" \
            node packages/traceai_openai/node_modules/jest/bin/jest.js \
            --config packages/traceai_openai/jest.config.js --runInBand --runTestsByPath \
            packages/traceai_openai/src/__tests__/providerHostsWire.test.ts \
            packages/traceai_openai/src/__tests__/provider.test.ts \
            packages/traceai_openai/src/__tests__/patchOwnership.test.ts
      - name: Run and typecheck the ESM README recipe
        if: matrix.sdk != '4.0.0'
        env:
          OPENAI_CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" OPENAI_CONSUMER_DIR="$OPENAI_CONSUMER_DIR" \
            node --test packages/traceai_openai/test/readme.cjs
          "$OPENAI_CONSUMER_DIR/node_modules/.bin/tsc" --noEmit --module nodenext --target es2022 \
            "$OPENAI_CONSUMER_DIR/perplexity.mts"
      - name: Network-isolated locked SDK unit suite
        if: matrix.sdk == '7.47.0'
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" node packages/traceai_openai/node_modules/jest/bin/jest.js \
            --config packages/traceai_openai/jest.config.js --runInBand
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" node packages/fi-core/node_modules/jest/bin/jest.js \
            --config packages/fi-core/jest.config.js --runInBand
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" FI_CORE_FIXTURE="${{ runner.temp }}/consumer" \
            node --test packages/fi-core/test/genai-privacy.test.cjs
