# Build-only reusable workflow: trusted publishing MUST run in top-level release.yml.
name: Release (Python packages)

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of planner entries ({name, version, dir, import_name, tag, changelog, ...})
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  package:
    name: ${{ matrix.name }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.packages) }}
    env:
      NAME: ${{ matrix.name }}
      VERSION: ${{ matrix.version }}
      DIR: ${{ matrix.dir }}
      IMPORT_NAME: ${{ matrix.import_name }}
      TAG: ${{ matrix.tag }}
      CHANGELOG: ${{ matrix.changelog }}
      REGISTRY_PUBLISHED: ${{ matrix.registry_published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Where the distributions go
        run: echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the build tools
        run: python -m pip install --quiet build==1.2.2 twine==7.0.0

      - name: Build the sdist and the wheel
        run: python -m build --outdir "$DIST" "$DIR"

      - name: Check the distributions
        run: |
          ls -l "$DIST"
          python -m twine check --strict "$DIST"/*

      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet "$DIST"/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import importlib, os
          from importlib.metadata import version
          name, want, module = os.environ["NAME"], os.environ["VERSION"], os.environ.get("IMPORT_NAME")
          got = version(name)
          assert got == want, f"installed {name} is {got}, the repository says {want}"
          if module:
              m = importlib.import_module(module)
              declared = getattr(m, "__version__", None)
              assert declared in (None, want), f"{module}.__version__ is {declared}, the package is {want}"
              print(f"import {module}: ok" + (f", __version__ = {declared}" if declared else ""))
          print(f"{name} {got}: installed and importable")
          PY
          "$RUNNER_TEMP/smoke/bin/pip" check

      - name: Keep the distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.tag }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
