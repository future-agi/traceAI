name: VoltAgent tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/**'
      - 'python/tests/harness/**'
      - '.github/workflows/voltagent-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/**'
      - 'python/tests/harness/**'
      - '.github/workflows/voltagent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FI_BASE_URL: http://127.0.0.1:9
  FI_GRPC_URL: http://127.0.0.1:9

jobs:
  voltagent:
    name: VoltAgent package and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Install pinned workspace dependencies
        working-directory: typescript
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --version
          corepack pnpm --filter @traceai/voltagent... install --frozen-lockfile --ignore-scripts
      - name: Build package dependencies and VoltAgent
        working-directory: typescript
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/voltagent run build
      - name: Unit tests (natural shutdown) and isolated upstream resume regression
        working-directory: typescript
        run: timeout 180 pnpm --filter @traceai/voltagent test
      - name: Real VoltAgent exporter contract (offline model)
        run: |
          python -m pip install pytest protobuf opentelemetry-proto jsonschema requests
          PYTHONPATH=python/tests python -m pytest typescript/packages/traceai_voltagent/contract -q --noconftest -p no:cacheprovider -o addopts=''
      - name: Build installable tarball without changing lockfile
        working-directory: typescript/packages/traceai_voltagent
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          test -n "$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          git diff --exit-code -- ../../pnpm-lock.yaml
