name: Coding-agent foundation contract

on:
  pull_request:
    paths:
      - 'typescript/packages/traceai_agent_core/**'
      - 'typescript/packages/traceai_agents/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'integrations/coding-agents/**'
      - 'python/fi_instrumentation/agent_constants.py'
      - '.github/release/**'
      - '.github/workflows/agent-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node: ['22.16.0', '24.11.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install selected workspace without lifecycle scripts
        working-directory: typescript
        run: pnpm --filter @traceai/agents... install --frozen-lockfile --ignore-scripts
      - name: Build qualified SQLite addon
        working-directory: typescript/packages/traceai_agents
        run: npm rebuild better-sqlite3
      - name: Build and test contracts
        working-directory: typescript
        run: |
          pnpm --filter @traceai/agents... run build
          pnpm --filter @traceai/agent-core --filter @traceai/agents test
      - name: Check release ownership
        run: |
          python3 -I .github/release/release_plan.py --check
          python3 -I .github/release/bootstrap_audit.py --check
      - name: Pack and install exact release artifacts
        run: |
          PACKAGES="$(node -e 'console.log(JSON.stringify(["traceai_agent_core","traceai_agents"].map(p => { const {name,version}=require("./typescript/packages/"+p+"/package.json"); return {name,version}; })))')"
          python3 .github/release/npm_release.py stage --packages "$PACKAGES" --dist "$RUNNER_TEMP/agent-dist"
          python3 .github/release/npm_release.py verify --packages "$PACKAGES" --dist "$RUNNER_TEMP/agent-dist" --smoke "$RUNNER_TEMP/agent-smoke"
