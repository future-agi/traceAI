name: OpenRouter Agent tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_openrouter_agent/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/openrouter-agent-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_openrouter_agent/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/openrouter-agent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: OpenRouter Agent (Node ${{ matrix.node }}, SDK ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
        sdk: ['0.13.7', '0.13.67']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: typescript/package.json
      - name: Frozen workspace install and build
        working-directory: typescript
        run: |
          pnpm --filter @traceai/openrouter-agent install --frozen-lockfile --ignore-scripts
          pnpm --filter @traceai/openrouter-agent run build
      - name: Pack and install a fresh consumer
        working-directory: typescript/packages/traceai_openrouter_agent
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/consumer"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP/package/traceai-openrouter-agent-"*.tgz \
            @openrouter/agent@0.11.0 "@openrouter/sdk@$SDK_VERSION" zod@4.6.7 \
            typescript@5.9.3 @types/node@22.20.5
          cp test/* "$RUNNER_TEMP/consumer/"
          npm --prefix "$RUNNER_TEMP/consumer" ls @openrouter/agent @openrouter/sdk
          git diff --exit-code -- ../../pnpm-lock.yaml
      - name: Type-check public API from a clean install
        run: |
          "$RUNNER_TEMP/consumer/node_modules/.bin/tsc" --noEmit --strict --skipLibCheck \
            --module NodeNext --target ES2022 "$RUNNER_TEMP/consumer/consumer.mts"
      - name: Real Agent and OTLP tests with network denied except loopback
        run: |
          sudo unshare --net bash -c 'ip link set lo up; exec "$1" --test "$2"/*.test.mjs' \
            bash "$(command -v node)" "$RUNNER_TEMP/consumer"
