name: Google GenAI SDK compatibility

on:
  pull_request:
    paths:
      - 'typescript/packages/traceai_google_genai_sdk/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - '.github/workflows/google-genai-sdk-compat.yml'
      - '.github/scripts/loopback-network-diagnostics.cjs'
      - '.github/scripts/check-loopback-network.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Temporary one-factor comparison; not a qualified harness correction.
  source-binding-comparison:
    runs-on: macos-14
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
        first: [baseline, source-bound]
        observation: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Cold ordered source-binding comparison under unchanged Seatbelt
        shell: bash
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-binding"
          mkdir "$evidence" "$RUNNER_TEMP/synthetic-home"
          policy="$GITHUB_WORKSPACE/typescript/packages/traceai_google_genai_sdk/test/network.sb"
          probe="$GITHUB_WORKSPACE/.github/scripts/check-loopback-source-binding.cjs"
          cp "$policy" "$evidence/network.sb"
          git rev-parse HEAD > "$evidence/head.txt"
          node --version > "$evidence/node.txt"
          second=source-bound
          if [[ "$FIRST" == source-bound ]]; then second=baseline; fi
          status=0
          for arm in "$FIRST" "$second"; do
            # Fixed independent observations: preserve BOTH exit statuses and
            # every error, never retry an operation or convert a failure to green.
            code=0
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/synthetic-home" TMPDIR="$RUNNER_TEMP" \
              sandbox-exec -f "$policy" node "$probe" "$arm" > "$evidence/$arm.log" 2>&1 || code=$?
            printf '%s\n' "$code" > "$evidence/$arm.exit"
            cat "$evidence/$arm.log"
            if [[ "$code" != 0 ]]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-binding-node${{ matrix.node }}-${{ matrix.first }}-${{ matrix.observation }}
          path: ${{ runner.temp }}/source-binding
          retention-days: 7
  packed-consumer:
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        sdk: ['1.33.0', '2.32.0']
        include:
          - node: 22
            sdk: '1.44.0'
          - node: 22
            sdk: '2.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build and pack with published shared dependencies
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/typescript/packages/traceai_google_genai_sdk"
          cp -R "$source" "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build"
          npm install --ignore-scripts
          sandbox-exec -f "$source/test/network.sb" npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Install clean customer application
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'traceai-google-genai-sdk-*.tgz' -print)
          npm install --ignore-scripts "$tarball" '@google/genai@${{ matrix.sdk }}' '@opentelemetry/sdk-trace-node@2.0.1' 'typescript@5.9.3' '@types/node@22' '@traceai/google-genai@0.1.0' '@google/generative-ai@0.24.1'
      - name: Real SDK, OTLP, privacy and exact customer snippet without internet
        shell: bash
        env:
          CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          tests="$GITHUB_WORKSPACE/typescript/packages/traceai_google_genai_sdk/test"
          # Verify the unchanged OS-level network boundary before the SDK suite.
          sandbox-exec -f "$tests/network.sb" node --require "$GITHUB_WORKSPACE/.github/scripts/loopback-network-diagnostics.cjs" "$GITHUB_WORKSPACE/.github/scripts/check-loopback-network.cjs" --check-denial
          # Repetitions fail immediately; they are a stability check, not retries.
          for repetition in 1 2 3 4 5; do
            echo "Loopback stability repetition $repetition/5"
            sandbox-exec -f "$tests/network.sb" node --require "$GITHUB_WORKSPACE/.github/scripts/loopback-network-diagnostics.cjs" --test "$tests/compat.test.cjs" "$tests/advanced.test.cjs" "$tests/edges.test.cjs" "$tests/regressions.test.cjs" "$tests/readme.test.cjs" "$tests/coexistence.test.cjs"
          done
      - name: Sandbox denial diagnostics
        if: failure()
        run: /usr/bin/log show --last 5m --style compact --predicate 'eventMessage CONTAINS "Sandbox"'
