name: Mastra TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_mastra/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/mastra-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_mastra/**'
      - '.github/workflows/mastra-typescript-tests.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Mastra ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: floor, core: '1.16.0', observability: '1.0.0', exporter: '1.0.0' }
          - { version: latest, core: latest, observability: latest, exporter: latest }
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install frozen dependencies
        run: |
          corepack enable
          pnpm --filter @traceai/mastra... install --frozen-lockfile --ignore-scripts
      - name: Build, offline unit test and pack
        run: |
          pnpm --filter @traceai/mastra... run build
          sudo unshare --net bash -c 'ip link set lo up; exec "$@"' _ \
            "$(command -v node)" "$PWD/node_modules/jest/bin/jest.js" \
            --config "$PWD/packages/traceai_mastra/jest.config.js" --runInBand
          mkdir -p "$RUNNER_TEMP/mastra-package"
          pnpm --dir packages/traceai_mastra pack --pack-destination "$RUNNER_TEMP/mastra-package"
          git diff --exit-code -- pnpm-lock.yaml
      - name: Install packed exporter and real SDK in a clean consumer
        env:
          CORE_VERSION: ${{ matrix.core }}
          OBSERVABILITY_VERSION: ${{ matrix.observability }}
          EXPORTER_VERSION: ${{ matrix.exporter }}
        run: |
          mkdir -p "$RUNNER_TEMP/mastra-consumer"
          npm install --prefix "$RUNNER_TEMP/mastra-consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP"/mastra-package/*.tgz \
            "@mastra/core@$CORE_VERSION" "@mastra/observability@$OBSERVABILITY_VERSION" \
            "@mastra/otel-exporter@$EXPORTER_VERSION" \
            @opentelemetry/otlp-transformer@0.201.1
      - name: Native lifecycle and wire contracts (loopback-only network namespace)
        run: |
          export MASTRA_TEST_DEPS="$RUNNER_TEMP/mastra-consumer"
          export MASTRA_TEST_PACKAGE="$RUNNER_TEMP/mastra-consumer/node_modules/@traceai/mastra/dist/src/index.js"
          sudo unshare --net bash -c 'ip link set lo up; exec "$@"' _ \
            env MASTRA_TEST_DEPS="$MASTRA_TEST_DEPS" MASTRA_TEST_PACKAGE="$MASTRA_TEST_PACKAGE" \
            "$(command -v node)" --test "$PWD/packages/traceai_mastra/contract/recall.test.cjs"
