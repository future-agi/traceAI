name: LangChain TypeScript contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_langchain/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/tsconfig*.json'
      - 'typescript/jest.setup.js'
      - '.github/workflows/langchain-typescript-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_langchain/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/tsconfig*.json'
      - 'typescript/jest.setup.js'
      - '.github/workflows/langchain-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langchain-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: LangChain core ${{ matrix.core }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        core: ['0.2.0', '0.3.0', '0.3.80', '1.0.0', '1.3.2']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install locked workspace and build package tarballs
        working-directory: typescript
        run: |
          corepack enable
          corepack pnpm --filter '@traceai/langchain...' install --frozen-lockfile --ignore-scripts
          corepack pnpm run build:deps
          corepack pnpm --filter @traceai/langchain run build
          mkdir -p "$RUNNER_TEMP/langchain-tarballs"
          for package in fi-semantic-conventions fi-core traceai_langchain; do
            corepack pnpm --dir "packages/$package" pack --pack-destination "$RUNNER_TEMP/langchain-tarballs"
          done
          git diff --exit-code -- pnpm-lock.yaml
      - name: Install isolated consumer without bypassing peers
        env:
          CORE_VERSION: ${{ matrix.core }}
        run: |
          mkdir -p "$RUNNER_TEMP/langchain-consumer"
          npm install --prefix "$RUNNER_TEMP/langchain-consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP/langchain-tarballs/"*.tgz "@langchain/core@$CORE_VERSION" \
            @opentelemetry/sdk-trace-base@2.0.1 @opentelemetry/exporter-trace-otlp-http@0.202.0
          cp typescript/packages/traceai_langchain/contract/lifecycle.mjs "$RUNNER_TEMP/langchain-consumer/"
          cp typescript/packages/traceai_langchain/contract/types.mts "$RUNNER_TEMP/langchain-consumer/"
          cp typescript/packages/traceai_langchain/contract/types.mts "$RUNNER_TEMP/langchain-consumer/types.cts"
      - name: Type-check packed public API with the consumer's core version
        run: |
          typescript/node_modules/.bin/tsc --noEmit --strict --skipLibCheck --module nodenext --target es2022 \
            "$RUNNER_TEMP/langchain-consumer/types.mts" "$RUNNER_TEMP/langchain-consumer/types.cts"
      - name: Unit regressions with outbound network disabled
        working-directory: typescript
        run: |
          sudo unshare --net bash -c 'ip link set lo up; exec "$@"' -- \
            "$(command -v node)" packages/traceai_langchain/node_modules/jest/bin/jest.js \
            --config packages/traceai_langchain/jest.config.js --runInBand
      - name: Real callback lifecycle and OTLP wire contracts, localhost only
        env:
          CORE_VERSION: ${{ matrix.core }}
        run: |
          modes='manual-cjs manual-esm'
          # Early cores have no root package export for OTel's require hook;
          # they use the documented explicit module setup instead.
          case "$CORE_VERSION" in
            0.2.0|0.3.0) ;;
            *) modes="$modes automatic" ;;
          esac
          for mode in $modes; do
            for privacy in public private; do
              sudo unshare --net bash -c 'ip link set lo up; exec "$@"' -- \
                "$(command -v node)" "$RUNNER_TEMP/langchain-consumer/lifecycle.mjs" "$mode" "$privacy"
            done
          done
