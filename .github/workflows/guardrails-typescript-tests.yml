name: Guardrails TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_guardrails/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/guardrails-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_guardrails/**'
      - '.github/workflows/guardrails-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Guardrails JS ${{ matrix.sdk }} real bridge
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.1.0', '0.1.1']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Build and pack
        working-directory: typescript
        run: |
          corepack enable
          corepack pnpm --filter @traceai/guardrails... install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @traceai/guardrails... run build
          corepack pnpm --dir packages/traceai_guardrails pack --pack-destination "$RUNNER_TEMP/packed"
      - name: Install real bridge and clean tarball consumer
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install 'guardrails-ai==0.4.2'
          mkdir -p "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/test-home"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP"/packed/*.tgz '@guardrails-ai/core@${{ matrix.sdk }}' \
            '@traceai/fi-core@1.1.0' '@opentelemetry/sdk-trace-node@1.30.1' \
            '@opentelemetry/exporter-trace-otlp-http@0.57.2' \
            '@opentelemetry/exporter-trace-otlp-proto@0.57.2' \
            '@opentelemetry/otlp-transformer@0.57.2'
          printf 'no_metrics=true\n' > "$RUNNER_TEMP/test-home/.guardrailsrc"
          printf '%s\n' '(version 1)' '(allow default)' '(deny network-outbound)' \
            '(allow network-outbound (remote ip "localhost:*"))' \
            '(allow network-outbound (remote unix-socket))' > "$RUNNER_TEMP/offline.sb"
      - name: Unit regressions (outbound denied)
        working-directory: typescript/packages/traceai_guardrails
        run: |
          sandbox-exec -f "$RUNNER_TEMP/offline.sb" env -i \
            HOME="$RUNNER_TEMP/test-home" PATH="$PATH" \
            "$(command -v node)" node_modules/jest/bin/jest.js --runInBand
      - name: Packed SDK bridge, OTLP wire, and README (outbound denied)
        run: |
          sandbox-exec -f "$RUNNER_TEMP/offline.sb" env -i \
            HOME="$RUNNER_TEMP/test-home" PATH="$PATH" \
            PYTHON_BIN="$RUNNER_TEMP/venv/bin/python" \
            "$(command -v node)" typescript/packages/traceai_guardrails/test/bridge.mjs "$RUNNER_TEMP/consumer"
          git diff --exit-code -- typescript/pnpm-lock.yaml
