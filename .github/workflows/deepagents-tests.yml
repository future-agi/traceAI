name: Deep Agents tests

on:
  pull_request:
    paths:
      - 'python/frameworks/langchain/**'
      - 'python/fi_instrumentation/**'
      - 'python/tests/harness/**'
      - 'python/tests/test_framework_langchain.py'
      - '.github/workflows/deepagents-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/langchain/**'
      - 'python/fi_instrumentation/**'
      - 'python/tests/harness/**'
      - 'python/tests/test_framework_langchain.py'
      - '.github/workflows/deepagents-tests.yml'

permissions:
  contents: read

jobs:
  deepagents:
    name: Deep Agents and core privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration, current core and real framework
        run: python -m pip install -e python -e python/frameworks/langchain 'deepagents==0.7.21' langgraph 'pytest-asyncio==0.24.0' 'pytest==8.4.2' pytest-mock
      - name: Test Deep Agents, sessions and error hiding
        run: |
          python -c 'from fi_instrumentation import TraceConfig; assert hasattr(TraceConfig(), "hide_error_details")'
          PYTHONPATH=python/tests python -m pytest python/frameworks/langchain/tests python/tests/test_framework_langchain.py -q -p no:cacheprovider -o addopts='' -o asyncio_mode=auto
      - name: Test compatibility with published core
        run: |
          python -m pip install --force-reinstall 'fi-instrumentation-otel==1.1.0'
          PYTHONPATH=python/tests python -P -m pytest python/frameworks/langchain/tests python/tests/test_framework_langchain.py -q -p no:cacheprovider -o addopts='' -o asyncio_mode=auto
