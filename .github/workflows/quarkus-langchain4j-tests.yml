name: Quarkus LangChain4j native adapter

on:
  pull_request:
    paths:
      - 'java/pom.xml'
      - 'java/traceai-bom/**'
      - 'java/traceai-java-quarkus-langchain4j/**'
      - 'java/examples/quarkus-langchain4j-example/**'
      - '.github/workflows/quarkus-langchain4j-tests.yml'
  push:
    branches: [dev, main]
    paths:
      - 'java/pom.xml'
      - 'java/traceai-java-quarkus-langchain4j/**'
      - 'java/examples/quarkus-langchain4j-example/**'
      - '.github/workflows/quarkus-langchain4j-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-adapter:
    name: Native OTLP (${{ matrix.langchain4j }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - langchain4j: '1.12.0'
            quarkus: '3.33.2'
          - langchain4j: '1.14.2'
            quarkus: '3.33.3.1'
    env:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
      QLC4J_VERSION: ${{ matrix.langchain4j }}
      QUARKUS_VERSION: ${{ matrix.quarkus }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Install the actual indexed adapter JAR
        run: java/mvnw -B -ntp -f java/pom.xml -pl traceai-java-quarkus-langchain4j -am -DskipTests install
      - name: Resolve dependencies before denying network access
        run: |
          java/mvnw -B -ntp -f java/examples/quarkus-langchain4j-example/pom.xml \
            -Dquarkus-langchain4j.version="$QLC4J_VERSION" -Dquarkus.platform.version="$QUARKUS_VERSION" \
            -Dquarkus.analytics.disabled=true dependency:go-offline quarkus:go-offline \
            dependency:get -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.5.4
      - name: Test native spans and packaged JVM shutdown with only loopback available
        run: |
          export MAVEN_USER_HOME="$HOME/.m2"
          sudo env JAVA_HOME="$JAVA_HOME" PATH="$JAVA_HOME/bin:$PATH" MAVEN_SKIP_RC=1 \
            JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS" MAVEN_USER_HOME="$MAVEN_USER_HOME" \
            QLC4J_VERSION="$QLC4J_VERSION" QUARKUS_VERSION="$QUARKUS_VERSION" \
            unshare --net bash -euc '
            ip link set lo up
            java/mvnw --version
            args=(-o -B -ntp -Dmaven.repo.local="$MAVEN_USER_HOME/repository"
              -f java/examples/quarkus-langchain4j-example/pom.xml
              -Dquarkus-langchain4j.version="$QLC4J_VERSION" -Dquarkus.platform.version="$QUARKUS_VERSION"
              -Dquarkus.analytics.disabled=true -Dquarkus.devservices.enabled=false)
            java/mvnw "${args[@]}" clean test
            java/mvnw "${args[@]}" -DskipTests -Dquarkus.otel.simple=false package
            java/mvnw "${args[@]}" failsafe:integration-test failsafe:verify
          '
      - name: Upload consumer test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-langchain4j-${{ matrix.langchain4j }}
          path: |
            java/examples/quarkus-langchain4j-example/target/surefire-reports/
            java/examples/quarkus-langchain4j-example/target/failsafe-reports/
            java/examples/quarkus-langchain4j-example/target/packaged-application.log
