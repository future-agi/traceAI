name: Integration tests

# Additive to python-tests.yml and livekit-release-check.yml. Only the seven
# targets listed in integration_plan.py are covered here; absent, not-yet-merged
# packages are ignored so each integration can carry this same CI independently.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FI_BASE_URL: http://127.0.0.1:9
  FI_GRPC_URL: http://127.0.0.1:9
  # Contract tests use local stand-ins; this workflow never needs vendor secrets.
  CI: 'true'

jobs:
  plan:
    name: Integration plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      typescript: ${{ steps.plan.outputs.typescript }}
      go: ${{ steps.plan.outputs.go }}
      java: ${{ steps.plan.outputs.java }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Test existing and integration planners and result gates
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python -m unittest discover -s .github/integration-ci -p 'test_*.py' -v
      - name: Plan changed integrations
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          planner=.github/integration-ci/integration_plan.py
          plan_file="$RUNNER_TEMP/integration-plan.json"
          case "$EVENT_NAME" in
            pull_request)
              if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
                timeout 120 git fetch --no-tags origin "$PR_BASE_SHA" || true
              fi
              if git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
                python "$planner" --diff "$PR_BASE_SHA...$PR_HEAD_SHA" > "$plan_file"
              else
                python "$planner" --all > "$plan_file"
              fi
              ;;
            push)
              if [ "$PUSH_BEFORE_SHA" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
                python "$planner" --all > "$plan_file"
              else
                python "$planner" --diff "$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA" > "$plan_file"
              fi
              ;;
            *) python "$planner" --all > "$plan_file" ;;
          esac
          jq . "$plan_file"
          for language in typescript go java; do
            echo "$language=$(jq -c --arg language "$language" '.[$language]' "$plan_file")" >> "$GITHUB_OUTPUT"
          done

  typescript:
    name: TypeScript (${{ matrix.package.name }})
    needs: plan
    if: needs.plan.outputs.typescript != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.typescript) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install locked target and workspace dependencies
        working-directory: typescript
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
        run: |
          # packageManager pins pnpm 10.30.1 with its integrity hash.
          corepack pnpm --version
          corepack pnpm --filter "@traceai/$PACKAGE_NAME..." install --frozen-lockfile --ignore-scripts
      - name: Build workspace dependencies and target, then run unit tests
        working-directory: typescript
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
        run: |
          corepack pnpm run build:deps
          corepack pnpm --filter "@traceai/$PACKAGE_NAME" run build
          corepack pnpm --filter "@traceai/$PACKAGE_NAME" test --runInBand
      - name: Codex real SDK contract (local subprocess, no API calls)
        if: matrix.package.name == 'codex-sdk'
        working-directory: ${{ matrix.package.dir }}
        run: node contract/run_real_sdk.mjs
      - name: Build installable tarball
        working-directory: ${{ matrix.package.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          corepack pnpm pack --pack-destination "$RUNNER_TEMP/package"
          test -n "$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          git diff --exit-code -- ../../pnpm-lock.yaml

  go:
    name: Go (${{ matrix.package.name }})
    needs: plan
    if: needs.plan.outputs.go != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.go) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: ${{ matrix.package.dir }}/go.sum
      - name: Verify modules, build package and example, vet and race-test
        working-directory: ${{ matrix.package.dir }}
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          go mod download
          go mod verify
          go build ./...
          go vet ./...
          go test -race -count=1 -v ./...
          git diff --exit-code -- go.mod go.sum

  java:
    name: Java (${{ matrix.package.name }})
    needs: plan
    if: needs.plan.outputs.java != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.java) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install checksum-pinned Maven 3.9.9
        run: bash .github/integration-ci/install_maven.sh
      - name: Build packaged application and run OTLP integration tests
        working-directory: ${{ matrix.package.dir }}
        run: |
          mvn --version
          mvn -B -ntp -DfailIfNoTests=true verify
          test -n "$(find target -name '*.jar' -print -quit)"
          git diff --exit-code -- pom.xml

  result:
    name: Integration tests
    needs: [plan, typescript, go, java]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require success from every planned language matrix
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/integration-ci/check_results.py
