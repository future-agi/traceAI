name: Java Spring AI compatibility

on:
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/java-spring-ai-compatibility.yml'
  push:
    branches: [dev]
    paths:
      - 'java/**'
      - '.github/workflows/java-spring-ai-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spring-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Spring AI ${{ matrix.spring }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - spring: '1.1.0'
            profile: ''
          - spring: '1.1.8'
            profile: ''
          - spring: '2.0.2'
            profile: '-Pspring2'
          - spring: '2.1.0-RC1'
            profile: '-Pspring2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'java/**/pom.xml'
      - name: Compile the SDK and package tests at the default target, then resolve runtime dependencies
        run: |
          # -DskipTests still compiles the package tests at the SDK's intended 1.1.8 target.
          mvn -B -ntp -f java/pom.xml -pl traceai-spring-ai -am install -DskipTests
          mvn -B -ntp -f java/pom.xml -pl traceai-spring-ai dependency:resolve -DincludeScope=test -Dspring-ai.version=${{ matrix.spring }}
          mvn -B -ntp -f java/compatibility/spring-ai/pom.xml test -DskipTests -Dspring-ai.version=${{ matrix.spring }} ${{ matrix.profile }}
          mvn -B -ntp -f java/compatibility/spring-ai/pom.xml dependency:get -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.2.3
          mvn -B -ntp -f java/compatibility/spring-ai/pom.xml dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.12.2
      - name: Run compiled package and installed-JAR tests on the selected runtime with loopback-only networking
        run: |
          # Invoke Surefire directly: the test lifecycle would recompile against the selected
          # runtime, but the floor lacks the newer accessor supported by the distributable JAR.
          sudo --preserve-env=JAVA_HOME,PATH unshare --net sh -c 'ip link set lo up; exec "$@"' sh \
            mvn -o -B -ntp -Dmaven.repo.local="$HOME/.m2/repository" -f java/pom.xml -pl traceai-spring-ai surefire:test \
            -Dspring-ai.version=${{ matrix.spring }} -DfailIfNoTests=true
          sudo --preserve-env=JAVA_HOME,PATH unshare --net sh -c 'ip link set lo up; exec "$@"' sh \
            mvn -o -B -ntp -Dmaven.repo.local="$HOME/.m2/repository" -f java/compatibility/spring-ai/pom.xml test \
            -Dspring-ai.version=${{ matrix.spring }} ${{ matrix.profile }} -DfailIfNoTests=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-ai-${{ matrix.spring }}-reports
          path: |
            java/traceai-spring-ai/target/surefire-reports/
            java/compatibility/spring-ai/target/surefire-reports/
