name: OpenAI and Anthropic TypeScript attachments
on:
  pull_request:
    paths:
      - 'typescript/packages/traceai_openai/**'
      - 'typescript/packages/traceai_anthropic/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/openai-anthropic-attachments-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attachments:
    name: OpenAI ${{ matrix.openai }} / Anthropic ${{ matrix.anthropic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { openai: '4.0.0', anthropic: '0.20.0' }
          - { openai: '5.23.2', anthropic: '0.27.3' }
          - { openai: '6.0.0', anthropic: '0.133.0' }
          - { openai: '7.47.0', anthropic: '0.134.0' }
          - { openai: 'latest', anthropic: 'latest' }
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install pinned workspace dependencies and real SDK fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --filter @traceai/openai... --filter @traceai/anthropic... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/sdks" --ignore-scripts --no-audit --no-fund \
            "openai-under-test@npm:openai@${{ matrix.openai }}" \
            "anthropic-under-test@npm:@anthropic-ai/sdk@${{ matrix.anthropic }}"
      - name: Build CJS and ESM
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/openai run build
          pnpm --filter @traceai/anthropic run build
      - name: Network-isolated attachment adapters against real SDKs and loopback mocks
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" \
            SDK_OPENAI="$RUNNER_TEMP/sdks/node_modules/openai-under-test" \
            SDK_ANTHROPIC="$RUNNER_TEMP/sdks/node_modules/anthropic-under-test" \
            node --test packages/traceai_openai/test/attachments-providers.test.cjs
      - name: Network-isolated package unit suites
        if: matrix.openai == 'latest'
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" node packages/traceai_openai/node_modules/jest/bin/jest.js \
            --config packages/traceai_openai/jest.config.js --runInBand
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash \
            env PATH="$PATH" node node_modules/jest/bin/jest.js \
            --config packages/traceai_anthropic/jest.config.js --runInBand
          git diff --exit-code -- pnpm-lock.yaml
