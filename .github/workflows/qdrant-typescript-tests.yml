name: Qdrant TypeScript tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_qdrant/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/qdrant-typescript-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_qdrant/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/qdrant-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdrant:
    name: Qdrant floor and current (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install and build the target and workspace dependencies
        working-directory: typescript
        run: |
          pnpm --filter @traceai/qdrant... install --frozen-lockfile --ignore-scripts
          pnpm run build:deps
          pnpm --filter @traceai/qdrant run build
      - name: Install the earliest published 1.x and current clients separately
        env:
          # The 1.1.1 client pins a public git dependency whose prepare builds
          # its transport. Use HTTPS without requiring an SSH identity.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: |
          npm install --prefix "$RUNNER_TEMP/qdrant-floor" --no-audit --no-fund @qdrant/js-client-rest@1.1.1
          npm install --prefix "$RUNNER_TEMP/qdrant-current" --ignore-scripts --no-audit --no-fund @qdrant/js-client-rest@1.20.0
      - name: Test with loopback only (no external network or vendor keys)
        run: |
          sudo env PATH="$PATH" QDRANT_FLOOR="$RUNNER_TEMP/qdrant-floor" QDRANT_CURRENT="$RUNNER_TEMP/qdrant-current" \
            unshare --net bash -eu -c '
              ip link set lo up
              cd typescript/packages/traceai_qdrant
              node ../../node_modules/jest/bin/jest.js --runInBand
              QDRANT_TEST_ROOT="$QDRANT_FLOOR" QDRANT_TEST_SECOND_ROOT="$QDRANT_CURRENT" node --test test/contract.test.cjs
              QDRANT_TEST_ROOT="$QDRANT_CURRENT" QDRANT_TEST_SECOND_ROOT="$QDRANT_FLOOR" node --test test/contract.test.cjs
            '
