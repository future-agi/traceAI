name: CrewAI Python compatibility

on:
  pull_request:
    paths:
      - 'python/frameworks/crewai/**'
      - 'python/tests/test_framework_crewai.py'
      - 'python/tests/conftest.py'
      - 'python/tests/pytest.ini'
      - '.github/workflows/crewai-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/crewai/**'
      - 'python/tests/test_framework_crewai.py'
      - 'python/tests/conftest.py'
      - 'python/tests/pytest.ini'
      - '.github/workflows/crewai-tests.yml'

permissions:
  contents: read

jobs:
  compatibility:
    name: CrewAI (${{ matrix.crewai }}, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        crewai: ['0.41.1', 'latest']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the declared floor or latest CrewAI
        env:
          CREWAI_VERSION: ${{ matrix.crewai }}
        run: |
          python -m venv .venv
          requirement="crewai==$CREWAI_VERSION"
          if [ "$CREWAI_VERSION" = latest ]; then
            requirement='crewai>=0.41.1'
          fi
          # Keep the core dependency at its declared minimum. The general Python
          # workflow separately exercises the repository's locked dependencies.
          .venv/bin/pip install -e python/frameworks/crewai "$requirement" \
            'fi-instrumentation-otel==1.2.2' \
            'pytest==8.4.2' 'pytest-asyncio==0.24.0' 'pytest-mock==3.14.0'
          .venv/bin/pip check
          .venv/bin/python -I -c 'from importlib.metadata import version; print("CrewAI", version("crewai"))'
      - name: Run the full wrapper and shared suites without outbound network
        run: |
          mkdir -p "$RUNNER_TEMP/crewai-home"
          sudo unshare --net -- bash -e -c '
            ip link set lo up
            export HOME="$3"
            export CREWAI_DISABLE_TELEMETRY=true CREWAI_DISABLE_TRACKING=true
            export CREWAI_TRACING_ENABLED=false OTEL_SDK_DISABLED=false
            export OPENAI_API_KEY=synthetic-openai-key
            export FI_API_KEY=synthetic-fi-key FI_SECRET_KEY=synthetic-fi-secret
            export FI_BASE_URL=http://127.0.0.1:9 FI_GRPC_URL=http://127.0.0.1:9
            "$1" -I -m pytest "$2/python/frameworks/crewai/tests" -q \
              -p no:cacheprovider -o addopts= -o asyncio_default_fixture_loop_scope=function
            "$1" -I -m pytest "$2/python/tests/test_framework_crewai.py" -q \
              -p no:cacheprovider -o addopts= -o asyncio_default_fixture_loop_scope=function
          ' _ "$PWD/.venv/bin/python" "$PWD" "$RUNNER_TEMP/crewai-home"
