name: Google GenAI resources

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/google-genai/**'
      - '.github/workflows/google-genai-resource-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/google-genai/**'
      - '.github/workflows/google-genai-resource-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            sdk: '1.8.0'
          - python: '3.12'
            sdk: '1.24.0'
          - python: '3.12'
            sdk: '1.75.0'
          - python: '3.13'
            sdk: '2.34.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package wheel
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          python -m pip install build
          python -m build --wheel python/frameworks/google-genai --outdir "$RUNNER_TEMP/dist"
          python -m pip install "$RUNNER_TEMP"/dist/*.whl "google-genai==$SDK_VERSION" pytest opentelemetry-exporter-otlp-proto-http
      - name: Test without outbound network
        run: |
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          python -I -m pytest python/frameworks/google-genai/tests/test_resources.py -q
