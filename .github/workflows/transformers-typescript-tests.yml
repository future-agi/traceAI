name: Transformers.js TypeScript contracts

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_huggingface_transformers/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/transformers-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Transformers ${{ matrix.transformers }} Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transformers: ['3.0.0', '4.3.2']
        node: ['22.13.1', '26.13.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build and pack the maintained adapter
        working-directory: typescript
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund pnpm@10.30.1
          export PATH="$RUNNER_TEMP/tools/node_modules/.bin:$PATH"
          PNPM="$RUNNER_TEMP/tools/node_modules/.bin/pnpm"
          "$PNPM" --filter @traceai/huggingface-transformers... install --frozen-lockfile --ignore-scripts
          "$PNPM" --filter @traceai/huggingface-transformers... run build
          "$PNPM" --dir packages/fi-core pack --out "$RUNNER_TEMP/fi-core.tgz"
          "$PNPM" --filter @traceai/huggingface-transformers pack --pack-destination "$RUNNER_TEMP/packed"
      - name: Clean-install tarball and stage pinned fixtures
        run: |
          TARBALL="$(find "$RUNNER_TEMP/packed" -name '*.tgz' -type f)"
          npm install --prefix "$RUNNER_TEMP/customer" --ignore-scripts --no-audit --no-fund \
            "$TARBALL" "$RUNNER_TEMP/fi-core.tgz" \
            "@huggingface/transformers@${{ matrix.transformers }}" \
            @opentelemetry/sdk-trace-node@2.0.1 @opentelemetry/exporter-trace-otlp-http@0.202.0 \
            typescript@5.9.3 @types/node@22
          PACKAGE=typescript/packages/traceai_huggingface_transformers
          cp -R "$PACKAGE/test" "$PACKAGE/examples" "$RUNNER_TEMP/customer/"
          python3 -I "$PACKAGE/test/fetch-fixtures.py" "$RUNNER_TEMP/fixtures"
      - name: Execute packed-package contracts with loopback only
        env:
          FIXTURES: ${{ runner.temp }}/fixtures
          CUSTOMER: ${{ runner.temp }}/customer
        run: |
          sudo --preserve-env=PATH,FIXTURES,CUSTOMER unshare --net bash -c '
            set -e
            ip link set lo up
            node --test "$CUSTOMER/test/unit.cjs"
            MODE=cjs node "$CUSTOMER/test/contract.cjs"
            MODE=esm node "$CUSTOMER/test/contract.cjs"
            node "$CUSTOMER/test/docs.cjs"
            node "$CUSTOMER/node_modules/typescript/bin/tsc" --noEmit --strict --skipLibCheck \
              --target ES2022 --module NodeNext --moduleResolution NodeNext "$CUSTOMER/test/types.mts"
          '
      - name: Save fixture integrity manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transformers-fixtures-${{ matrix.transformers }}-${{ matrix.node }}
          path: ${{ runner.temp }}/fixtures/manifest.json
