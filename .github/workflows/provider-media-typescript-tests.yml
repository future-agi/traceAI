name: TypeScript provider media attachments

on:
  pull_request:
    paths:
      - 'typescript/packages/traceai_provider_media/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/traceai_openai/**'
      - 'typescript/packages/traceai_groq/**'
      - 'typescript/packages/traceai_google_genai/**'
      - 'typescript/packages/traceai_google_genai_sdk/**'
      - 'typescript/packages/traceai_vertexai/**'
      - 'typescript/packages/traceai_bedrock/**'
      - 'typescript/packages/traceai_mistral/**'
      - 'typescript/packages/traceai_portkey/**'
      - 'typescript/packages/traceai_vllm/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/provider-media-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-media:
    name: Provider media / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned workspace dependencies
        working-directory: typescript
        run: |
          npm install --global pnpm@10.30.1
          pnpm --filter '@traceai/provider-media...' --filter '@traceai/openai...' --filter '@traceai/groq...' \
            --filter '@traceai/google-genai...' --filter '@traceai/google-genai-sdk...' --filter '@traceai/fi-instrumentation-vertexai...' \
            --filter '@traceai/bedrock...' --filter '@traceai/mistral...' --filter '@traceai/portkey...' --filter '@traceai/vllm...' \
            install --frozen-lockfile --ignore-scripts
      - name: Build the helper and every bound provider package
        working-directory: typescript
        run: |
          pnpm --filter '@traceai/provider-media...' --filter '@traceai/openai...' --filter '@traceai/groq...' \
            --filter '@traceai/google-genai...' --filter '@traceai/google-genai-sdk...' --filter '@traceai/fi-instrumentation-vertexai...' \
            --filter '@traceai/bedrock...' --filter '@traceai/mistral...' --filter '@traceai/portkey...' --filter '@traceai/vllm...' \
            --workspace-concurrency=1 run build
      - name: Install the pinned real provider SDKs (floor and latest)
        working-directory: typescript
        run: node packages/traceai_provider_media/test/install-sdks.cjs "$RUNNER_TEMP/provider-sdks"
      - name: Helper privacy, lifetime and dedup tests; real SDKs against loopback only
        working-directory: typescript
        env:
          MEDIA_SDK_ROOT: ${{ runner.temp }}/provider-sdks
        run: |
          # Only loopback exists inside this namespace, so no provider request can leave.
          # One SDK tier per process: some instrumentations keep process-wide patch state.
          sudo --preserve-env=MEDIA_SDK_ROOT unshare --net bash -c '
            ip link set lo up
            "$1" --test packages/traceai_provider_media/test/media.test.cjs &&
            MEDIA_SDK_TIER=floor "$1" --test packages/traceai_provider_media/test/sdk.test.cjs &&
            MEDIA_SDK_TIER=latest "$1" --test packages/traceai_provider_media/test/sdk.test.cjs
          ' _ "$(command -v node)"
      - name: Install the packed helper in a clean consumer
        working-directory: typescript
        run: |
          pnpm --dir packages/fi-core pack --out "$RUNNER_TEMP/core.tgz"
          pnpm --dir packages/traceai_provider_media pack --out "$RUNNER_TEMP/provider-media.tgz"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP/core.tgz" "$RUNNER_TEMP/provider-media.tgz"
          cd "$RUNNER_TEMP/consumer"
          node -e "const m=require('@traceai/provider-media'); if (typeof m.ProviderMediaCapture !== 'function' || !Object.isFrozen(m.PROVIDER_MEDIA_CAPABILITIES)) process.exit(1)"
          node --input-type=module -e "import { ProviderMediaCapture } from '@traceai/provider-media'; if (typeof ProviderMediaCapture !== 'function') process.exit(1)"
      - name: Verify lockfile stays unchanged
        run: git diff --exit-code -- typescript/pnpm-lock.yaml
