name: Mastra README contract

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_mastra/**'
      - '.github/workflows/mastra-readme-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_mastra/**'
      - '.github/workflows/mastra-readme-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: Mastra README (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: peer-floor
            core: '1.16.0'
            observability: '1.0.0'
            exporter: '1.0.0'
          - name: current
            core: '1.81.0'
            observability: '1.23.0'
            exporter: '1.5.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install published package and pinned peers
        env:
          MASTRA_CORE: ${{ matrix.core }}
          MASTRA_OBSERVABILITY: ${{ matrix.observability }}
          MASTRA_EXPORTER: ${{ matrix.exporter }}
        run: |
          npm install --prefix "$RUNNER_TEMP/mastra-readme" --ignore-scripts --no-audit --no-fund \
            @traceai/mastra@0.2.0 "@mastra/core@$MASTRA_CORE" \
            "@mastra/observability@$MASTRA_OBSERVABILITY" "@mastra/otel-exporter@$MASTRA_EXPORTER" \
            @opentelemetry/api@1.9.1 @opentelemetry/exporter-trace-otlp-proto@0.201.1 \
            typescript@5.9.3 @types/node@22.15.29
      - name: Compile README and check OTLP with localhost-only networking
        run: |
          sudo unshare --net sh -c '
            ip link set lo up
            exec "$1" "$2" "$3"
          ' sh "$(command -v node)" \
            "$GITHUB_WORKSPACE/typescript/packages/traceai_mastra/contract/readme.test.mjs" \
            "$RUNNER_TEMP/mastra-readme"
