name: Vercel gateway client tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/vercel-gateway-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'python/frameworks/openai/**'
      - 'python/fi_instrumentation/**'
      - '.github/workflows/vercel-gateway-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Gateway OTLP (openai ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ['1.69.0', '3.42.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install the SDK and published tracing core
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: python -m pip install "openai==$SDK_VERSION" 'fi-instrumentation-otel==1.2.2' pytest pytest-socket
      - name: Run SDK-to-OTLP contracts with non-local sockets blocked
        env:
          PYTHONPATH: python/frameworks/openai
        run: |
          python -m pytest python/frameworks/openai/tests/test_vercel_gateway.py -q \
            --disable-socket --allow-hosts=127.0.0.1,localhost --allow-unix-socket
