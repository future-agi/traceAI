name: Together tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_together/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - 'typescript/pnpm-workspace.yaml'
      - 'typescript/package.json'
      - '.github/workflows/together-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_together/**'
      - '.github/workflows/together-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  together:
    name: Together package and real SDK contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FI_BASE_URL: http://127.0.0.1:9
      FI_GRPC_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install pinned workspace dependencies
        working-directory: typescript
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          corepack pnpm --version
          corepack pnpm --filter '@traceai/together...' install --frozen-lockfile --ignore-scripts
      - name: Build shared dependencies and Together
        working-directory: typescript
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/together run build
      - name: Unit tests
        working-directory: typescript
        run: pnpm --filter @traceai/together test --runInBand
      - name: Real SDK contract at the supported floor, workspace and current releases
        # Synthetic fetch only; the contract refuses every non-loopback socket.
        run: |
          node typescript/packages/traceai_together/contract/real-sdk.cjs
          for version in 0.6.0 1.0.0; do
            sdk="$RUNNER_TEMP/together-ai-$version"
            npm install --prefix "$sdk" --ignore-scripts --no-audit --no-fund "together-ai@$version"
            node typescript/packages/traceai_together/contract/real-sdk.cjs "$sdk/node_modules/together-ai"
          done
      - name: Build installable tarball without changing lockfile
        working-directory: typescript/packages/traceai_together
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          test -n "$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          git diff --exit-code -- ../../pnpm-lock.yaml
