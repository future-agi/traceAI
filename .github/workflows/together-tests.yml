name: Together compatibility

# Together renamed its resource classes in 2.0. Test the supported floor, the 2.x
# transition and the current SDK against the real client classes.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'python/frameworks/together/**'
      - '.github/workflows/together-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'python/frameworks/together/**'
      - '.github/workflows/together-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compatibility:
    name: Together ${{ matrix.together }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            together: '1.0.1'
          - python: '3.11'
            together: '1.6.0'
          - python: '3.11'
            together: '2.0.0'
          - python: '3.13'
            together: '3.0.0'
    env:
      FI_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and compatibility pins
        run: |
          python -m pip install './python/frameworks/together' 'together==${{ matrix.together }}' \
            'fi-instrumentation-otel==1.2.2' 'pytest==8.4.2'
      - name: Test with outbound network disabled
        # Loopback remains available for the synthetic Together API and OTLP receiver.
        run: |
          sudo unshare --net bash -c '
            ip link set lo up
            exec "$1" -m pytest "$2" -q -p no:cacheprovider
          ' _ "$(command -v python)" "$GITHUB_WORKSPACE/python/frameworks/together/tests"
