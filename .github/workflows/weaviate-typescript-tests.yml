name: Weaviate TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'typescript/packages/traceai_weaviate/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/weaviate-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Weaviate SDK ${{ matrix.sdk }} offline contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.0.0', '3.15.3']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install frozen workspace and real SDK endpoint
        run: |
          pnpm --filter '@traceai/weaviate...' install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/weaviate-sdk" --ignore-scripts 'weaviate-client@${{ matrix.sdk }}'
      - name: Build package and dependencies
        run: pnpm --filter '@traceai/weaviate...' --workspace-concurrency=1 run build
      - name: Run real SDK, OTLP wire, and module tests with loopback-only networking
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            export WEAVIATE_TEST_PACKAGE="$3/node_modules/weaviate-client"
            "$1" "$2/node_modules/jest/bin/jest.js" --config "$2/jest.config.js" --runInBand
            "$1" "$2/src/__tests__/module-smoke.cjs" cjs
            "$1" "$2/src/__tests__/module-smoke.cjs" esm
          ' _ "$(command -v node)" "$PWD/packages/traceai_weaviate" "$RUNNER_TEMP/weaviate-sdk"
      - name: Pack without changing the lockfile
        run: |
          pnpm --filter '@traceai/weaviate' pack --pack-destination "$RUNNER_TEMP/weaviate-package"
          git diff --exit-code -- pnpm-lock.yaml
