name: ChromaDB TypeScript tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'typescript/packages/traceai_chromadb/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/chromadb-typescript-tests.yml'
  push:
    branches: [dev]
    paths:
      - 'typescript/packages/traceai_chromadb/**'
      - 'typescript/packages/fi-core/**'
      - 'typescript/packages/fi-semantic-conventions/**'
      - 'typescript/pnpm-lock.yaml'
      - '.github/workflows/chromadb-typescript-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Chroma ${{ matrix.chroma }} CJS and ESM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1.0.0 has no Node entry point. Keep its existing peer range, but
        # exercise the early 1.1 API and both ends of the v2/v3 release ranges.
        chroma: ['1.1.0', '1.10.5', '2.0.0', '2.4.6', '3.0.0', '3.5.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        working-directory: typescript
        env:
          CHROMA_VERSION: ${{ matrix.chroma }}
        run: |
          npm install --global pnpm@10.30.1
          pnpm --filter @traceai/chromadb... install --frozen-lockfile --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/chroma" --ignore-scripts --no-audit --no-fund "chromadb@$CHROMA_VERSION"
      - name: Build package and dependencies
        working-directory: typescript
        run: |
          pnpm run build:deps
          pnpm --filter @traceai/chromadb run build
      - name: Unit and real SDK contract tests with loopback-only networking
        env:
          CHROMADB_TEST_ROOT: ${{ runner.temp }}/chroma
        run: |
          # A new network namespace has no external interface or routes. Bring
          # up only loopback for the synthetic Chroma server and OTLP receiver.
          sudo env PATH="$PATH" CHROMADB_TEST_ROOT="$CHROMADB_TEST_ROOT" unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            pnpm --dir typescript --filter @traceai/chromadb test --runInBand
            package="$PWD/typescript/packages/traceai_chromadb"
            for format in cjs esm; do
              for mode in manual auto; do
                loader=()
                if [[ "$format" == esm && "$mode" == auto ]]; then
                  loader=(--import "$package/test/register-loader.mjs")
                fi
                CHROMADB_TEST_FORMAT="$format" CHROMADB_TEST_MODE="$mode" \
                  node "${loader[@]}" "$package/test/runtime.cjs"
              done
            done
          '
