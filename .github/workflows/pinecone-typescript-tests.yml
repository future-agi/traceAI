name: Pinecone TypeScript tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - typescript/packages/traceai_pinecone/**
      - typescript/packages/fi-core/**
      - typescript/packages/fi-semantic-conventions/**
      - typescript/pnpm-lock.yaml
      - .github/workflows/pinecone-typescript-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['2.0.0', '4.1.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install and build
        working-directory: typescript
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          corepack enable
          corepack pnpm --filter @traceai/pinecone... install --frozen-lockfile --ignore-scripts
          corepack pnpm run build:deps
          corepack pnpm --filter @traceai/pinecone build
          npm install --prefix "$RUNNER_TEMP/pinecone-sdk" --ignore-scripts --no-audit --no-fund "@pinecone-database/pinecone@$SDK_VERSION"
          npm install --prefix "$RUNNER_TEMP/pinecone-current" --ignore-scripts --no-audit --no-fund @pinecone-database/pinecone@9.1.0
      - name: Test real SDK lifecycle and OTLP export with only loopback networking
        working-directory: typescript/packages/traceai_pinecone
        run: |
          mapper=$(jq -cn --arg sdk "$RUNNER_TEMP/pinecone-sdk/node_modules/@pinecone-database/pinecone" '{
            "^@traceai/fi-core$": "<rootDir>/../fi-core/src",
            "^@traceai/fi-semantic-conventions$": "<rootDir>/../fi-semantic-conventions/src",
            "^@pinecone-database/pinecone$": $sdk
          }')
          sudo unshare --net bash -euc '
            ip link set lo up
            "$1" ../../node_modules/jest/bin/jest.js --runInBand "--moduleNameMapper=$2"
            "$1" contract/lifecycle.cjs "$3"
            "$1" contract/lifecycle.cjs "$4" unsupported
          ' -- "$(command -v node)" "$mapper" "$RUNNER_TEMP/pinecone-sdk" "$RUNNER_TEMP/pinecone-current"
