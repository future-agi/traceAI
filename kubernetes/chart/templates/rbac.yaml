apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "traceai.fullname" . }}
  labels:
    {{- include "traceai.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "traceai.clustername" . }}
  labels:
    {{- include "traceai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "traceai.clustername" . }}
  labels:
    {{- include "traceai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "traceai.clustername" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "traceai.fullname" . }}
    namespace: {{ .Release.Namespace }}
