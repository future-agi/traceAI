{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "traceai.fullname" . }}
  labels:
    {{- include "traceai.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "traceai.selectorLabels" . | nindent 6 }}
{{- end }}
