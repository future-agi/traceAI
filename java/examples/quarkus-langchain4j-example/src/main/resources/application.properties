# --- Model provider: any OpenAI-compatible endpoint ---------------------------------------------------------------
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:gpt-4o-mini}
quarkus.langchain4j.timeout=60s

# --- Future AGI: Quarkus OpenTelemetry exports the spans Quarkus LangChain4j creates --------------------------------
# HTTP/protobuf, not the gRPC default. Quarkus appends /v1/traces to this URL, so stop at /tracer.
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.endpoint=${FI_BASE_URL:https://api.futureagi.com}/tracer
quarkus.otel.exporter.otlp.traces.headers=X-Api-Key=${FI_API_KEY},X-Secret-Key=${FI_SECRET_KEY}
# Already Quarkus' default. Kept explicit so export also works with self-hosted collectors older than v1.56.0; Future AGI Cloud and v1.56.0+ accept gzip.
quarkus.otel.exporter.otlp.traces.compression=none
quarkus.otel.resource.attributes=project_name=${FI_PROJECT_NAME},project_type=observe

# --- Privacy defaults ----------------------------------------------------------------------------------------------
# Prompt, completion, tool arguments and tool results stay off (Quarkus LangChain4j defaults, written out).
# Turn them on with the four properties set to true, or QUARKUS_LANGCHAIN4J_TRACING_INCLUDE_PROMPT=true and so on.
quarkus.langchain4j.tracing.include-prompt=false
quarkus.langchain4j.tracing.include-completion=false
quarkus.langchain4j.tracing.include-tool-arguments=false
quarkus.langchain4j.tracing.include-tool-result=false
# No span events. Quarkus LangChain4j records failures as exception events carrying exception.message and the full
# exception.stacktrace; this drops them. Failed spans still get status ERROR from FutureAgiTracingDefaults.
# 0 needs the OpenTelemetry SDK 1.51+ (Quarkus 3.33.3.1 ships 1.57.0; Quarkus 3.27.2 ships 1.44.1 and refuses to start).
quarkus.otel.span.event.count.limit=0

# --- This example is a short command-line run --------------------------------------------------------------------
# Export each span as it ends instead of waiting for the batch timer (build-time property). A long-running service
# can drop this line: the batch is flushed when Quarkus shuts down normally.
quarkus.otel.simple=true
quarkus.banner.enabled=false
quarkus.log.level=WARN
