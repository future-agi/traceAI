[tool.poetry]
name = "fi-instrumentation-otel"
version = "1.5.1"
description = "OpenTelemetry tracing for AI applications: tracer setup, span helpers, exporters, and semantic conventions for Future AGI."
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "fi_instrumentation" },
    # Imported by fi_instrumentation_auto.pth, outside the package so a broken package install
    # prints one line at interpreter start instead of a traceback.
    { include = "fi_instrumentation_auto.py" },
]

exclude = [
    "frameworks",
    # A byte-identical copy of spec/auto-instrumentation/privacy-fixtures.json, kept beside the
    # catalog for the repository's catalog check. Only privacy.json ships in the package.
    "fi_instrumentation/auto/wire/privacy-fixtures.json",
]

# FI_AUTO_INSTRUMENT=true starts the agent at interpreter start: the wheel puts this file in
# site-packages. It does nothing unless that variable is set.
include = [
    { path = "fi_instrumentation_auto.pth", format = ["sdist", "wheel"] },
    # The shared privacy catalog the agent applies to everything it sends to Future AGI. It is a
    # byte-identical copy of spec/auto-instrumentation/privacy.json; the directory is not a module.
    { path = "fi_instrumentation/auto/wire/privacy.json", format = ["sdist", "wheel"] },
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
# Core tracing and grpc support 3.15 independently of evaluation's native
# dependencies. Keep evaluation opt-in; do not silently drop it via markers.
python = ">=3.10,<3.16"
opentelemetry-api = "^1.29.0"
opentelemetry-sdk = "^1.29.0"
opentelemetry-exporter-otlp-proto-http = ">=1.29.0,<1.46"
opentelemetry-instrumentation = "*"
requests = "^2.32.3"
typing-extensions = "^4.9.0"
pydantic = "^2.9.2"
wrapt = "^1.15.0"
jsonschema = "^4.21.1"
futureagi = {version = ">=0.6.0", optional = true}
ai-evaluation = {version = ">=0.1.0", optional = true}
opentelemetry-exporter-otlp-proto-grpc = {version = ">=1.29.0,<1.46", optional = true}

[tool.poetry.extras]
grpc = ["opentelemetry-exporter-otlp-proto-grpc"]
evaluation = ["futureagi", "ai-evaluation"]

[tool.poetry.scripts]
fi-instrument = "fi_instrumentation.auto._cli:main"

[tool.poetry.plugins."opentelemetry_instrumentor"]
futureagi = "fi_instrumentation.auto._otel_entry:FutureAGIInstrumentor"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.11.0"
pytest-cov = "^4.1.0"
responses = "^0.23.0"

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
