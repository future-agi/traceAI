[tool.poetry]
name = "traceai"
version = "0.1.0"
description = "Initialize Future AGI OpenTelemetry tracing and opt in to installed AI framework instrumentors with one call."
authors = ["Future AGI <no-reply@futureagi.com>"]

packages = [
    { include = "traceai", from = ".." },
]
license = "Apache-2.0"
readme = "README.md"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">3.9,<3.13"
fi-instrumentation-otel = ">=0.1.7"

[tool.poetry.extras]
# Optional instrumentors
openai = ["traceai-openai"]
anthropic = ["traceai-anthropic"]
langchain = ["traceai-langchain"]
llamaindex = ["traceai-llamaindex"]
litellm = ["traceai-litellm"]
groq = ["traceai-groq"]
mistralai = ["traceai-mistralai"]
cohere = ["traceai-cohere"]
bedrock = ["traceai-bedrock"]
vertexai = ["traceai-vertexai"]
crewai = ["traceai-crewai"]
autogen = ["traceai-autogen"]
dspy = ["traceai-dspy"]
haystack = ["traceai-haystack"]
instructor = ["traceai-instructor"]
all = [
    "traceai-openai",
    "traceai-anthropic",
    "traceai-langchain",
    "traceai-llamaindex",
    "traceai-litellm",
]

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/traceai"
Changelog = "https://github.com/future-agi/traceAI/releases"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
