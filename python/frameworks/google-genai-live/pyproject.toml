[tool.poetry]
name = "traceAI-google-genai-live"
version = "0.1.0"
description = "Future AGI tracing for Gemini Live sessions (google-genai client.aio.live.connect): one trace per session with turns, tool calls, interruptions and usage"
authors = ["Future AGI <no-reply@futureagi.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "traceai_google_genai_live" },
]
keywords = ["opentelemetry", "gemini", "gemini-live", "google-genai", "voice", "realtime", "tracing", "observability", "traceai", "futureagi", "llm", "google-genai-live"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
]

[tool.poetry.dependencies]
# fi-instrumentation-otel declares python <3.14.
python = ">=3.10,<3.14"
# Gemini Live is preview. AsyncLive.connect and the send_client_content /
# send_realtime_input / send_tool_response / receive methods work at the 2.28 floor.
# send_context_update is optional on older SDKs, covered at 2.34. Keep the preview API below 3.
google-genai = ">=2.28,<3"
fi-instrumentation-otel = ">=0.1.11"
opentelemetry-api = ">=1.29.0"
opentelemetry-sdk = ">=1.29.0"
opentelemetry-instrumentation = ">=0.50b0"
wrapt = ">=1.15.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.23.0"
opentelemetry-exporter-otlp-proto-http = ">=1.29.0"

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/google-genai-live"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/google-genai-live/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
