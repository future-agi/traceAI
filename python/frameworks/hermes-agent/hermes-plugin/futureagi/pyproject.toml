# Read by Hermes' package manager when the plugin is enabled; not a package to build.
[project]
name = "futureagi-hermes-plugin"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "traceAI-hermes-agent>=0.1.0,<0.2",
]
description = "Hermes directory-plugin manifest for the traceAI-hermes-agent OpenTelemetry integration."
license = "Apache-2.0"
readme = "README.md"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/hermes-agent/hermes-plugin/futureagi"
Changelog = "https://github.com/future-agi/traceAI/releases"
Issues = "https://github.com/future-agi/traceAI/issues"
