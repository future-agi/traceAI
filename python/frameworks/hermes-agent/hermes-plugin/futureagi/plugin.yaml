name: futureagi
version: 0.1.1
description: "Future AGI tracing: one OpenTelemetry trace per Hermes turn, with model and tool spans. Shared setup captures content; FI_AGENT_CAPTURE_CONTENT=false keeps metadata only. Native env-only installs retain opt-in capture."
author: "Future AGI"
license: Apache-2.0
homepage: https://github.com/future-agi/traceAI/tree/main/python/frameworks/hermes-agent
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - post_tool_call
  - on_session_end
  - on_session_finalize
  - subagent_start
  - subagent_stop
