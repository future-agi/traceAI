[tool.poetry]
name = "traceAI-smolagents"
version = "0.1.5"
description = "OpenTelemetry instrumentation for Smolagents"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_smolagents" },
]

[tool.poetry.dependencies]
python = ">3.10, <3.14"
smolagents = ">=1.12.0"
fi-instrumentation-otel = ">=0.1.11"


[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
pytest-recording = ">=0.13.2"
openai = ">=1.0.0"

[tool.poetry.plugins."opentelemetry_instrumentor"]
smolagents = "traceai_smolagents:SmolagentsInstrumentor"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
