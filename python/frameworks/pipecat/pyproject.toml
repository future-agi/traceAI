[tool.poetry]
name = "traceAI-pipecat"
version = "0.1.1"
description = "OpenTelemetry instrumentation for Pipecat"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
packages = [
    { include = "traceai_pipecat" }
]

[tool.poetry.dependencies]
python = ">3.9,<3.14"
fi-instrumentation-otel = ">=0.1.14"

[tool.poetry.group.dev.dependencies]
pytest = "==8.4.2"
pytest-asyncio = "==0.24.0"
# Native Pipecat tracing from the documented example's exact SDK floor.
pipecat-ai = { version = "==0.0.77", extras = ["google", "openai", "tracing"], python = ">=3.10" }
fi-instrumentation-otel = { version = ">=0.1.14", extras = ["grpc"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
