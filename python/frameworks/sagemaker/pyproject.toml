[tool.poetry]
name = "traceAI-sagemaker"
version = "0.1.0"
description = "OpenTelemetry instrumentation for Amazon SageMaker Runtime endpoints"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "sagemaker", "aws"]
packages = [{ include = "traceai_sagemaker" }]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fi-instrumentation-otel = ">=1.0.0"
botocore = "*"
boto3 = ">=1.34.0"
wrapt = ">=1.15.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
# The coexistence tests install both boto3-based instrumentors together.
traceAI-bedrock = ">=0.1.10"

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/sagemaker"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/sagemaker"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/sagemaker/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
