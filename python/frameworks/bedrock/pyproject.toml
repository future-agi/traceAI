[tool.poetry]
name = "traceAI-bedrock"
version = "0.1.10"
description = "OpenTelemetry instrumentation for Bedrock"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_bedrock" },
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "bedrock"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
dacite = ">=1.8.1"
fi-instrumentation-otel = ">=0.1.11"
botocore = "*"
boto3 = ">=1.38.17"


[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/bedrock"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/bedrock"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/bedrock/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
