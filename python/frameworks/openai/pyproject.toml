[tool.poetry]
name = "traceAI-openai"
version = "0.1.13"
description = "OpenTelemetry instrumentation for OpenAI"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
packages = [
    { include = "traceai_openai" }
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "openai"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fi-instrumentation-otel = ">=1.2.3"
openai = ">=1.69.0"

# Test the release candidate before it exists on PyPI. This dev-only source
# never appears in the wheel's runtime requirements (which retain >=1.2.3).
[tool.poetry.group.dev.dependencies]
fi-instrumentation-otel = {path = "../..", develop = true}

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/openai"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/openai"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/openai/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
