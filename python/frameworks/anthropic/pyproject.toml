[tool.poetry]
name = "traceAI-anthropic"
version = "0.1.11"
description = "OpenTelemetry instrumentation for Anthropic"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_anthropic" },
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "anthropic"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">3.9, <3.14"
anthropic = ">=0.41.0"
fi-instrumentation-otel = ">=1.2.2"


[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/anthropic"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/anthropic"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/anthropic/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
