[tool.poetry]
name = "traceAI-langchain"
version = "0.2.0"
description = "OpenTelemetry instrumentation for Langchain"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_langchain" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fi-instrumentation-otel = ">=1.0.0"
langchain-core = ">=0.2.43"
langgraph = {version = ">=0.2.0", optional = true}

[tool.poetry.extras]
langgraph = ["langgraph"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
langgraph = ">=0.2.0"
packaging = ">=21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
