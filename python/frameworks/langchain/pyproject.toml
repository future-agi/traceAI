[tool.poetry]
name = "traceAI-langchain"
version = "0.2.0"
description = "OpenTelemetry instrumentation for Langchain"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_langchain" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fi-instrumentation-otel = ">=0.1.11"
# The instrumentation only imports langchain-core (+ optional langgraph). The
# `langchain` / `langchain-community` meta-packages are intentionally not required:
# pinning them (esp. langchain-community <0.4) transitively caps langchain-core and
# blocks LangChain/LangGraph 1.x. Users who need those install them directly.
langchain-core = ">=0.2.43"
langgraph = {version = ">=0.2.0", optional = true}

[tool.poetry.extras]
langgraph = ["langgraph"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
