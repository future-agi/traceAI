[tool.poetry]
name = "traceAI-elevenlabs-agents"
version = "0.1.0"
description = "Forward ElevenLabs Agents post-call OpenTelemetry traces to Future AGI (Observe Voice tab)"
authors = ["Future AGI <no-reply@futureagi.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "traceai_elevenlabs_agents" }
]
keywords = ["opentelemetry", "elevenlabs", "voice", "agents", "webhook", "tracing", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
# Standard library only at runtime: HMAC, HTTP server, OTLP/HTTP JSON export,
# SQLite idempotency record. The ElevenLabs SDK is a test oracle, not a dependency.
python = ">=3.10,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
# Signature oracle (construct_event). 2.73.0 is the latest stable on 2026-10-15;
# the tests also pass against 2.70.0, the version the PRD pinned.
elevenlabs = "2.73.0"

[tool.poetry.scripts]
traceai-elevenlabs-agents = "traceai_elevenlabs_agents.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
