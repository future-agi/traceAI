[tool.poetry]
name = "traceAI-a2a"
version = "0.1.0"
description = "OpenTelemetry instrumentation for Google Agent-to-Agent (A2A) Protocol — distributed tracing across multi-agent boundaries"
authors = ["Future AGI <no-reply@futureagi.com>"]
license = "MIT"
readme = "README.md"
keywords = ["opentelemetry", "tracing", "a2a", "agents", "multi-agent", "futureagi", "llm", "traceai", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
packages = [{ include = "traceai_a2a" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
opentelemetry-api = ">=1.26.0"
opentelemetry-sdk = ">=1.26.0"
opentelemetry-instrumentation = ">=0.47b0"
fi-instrumentation-otel = ">=0.1.11"
a2a-sdk = { version = ">=0.2.4,<2", optional = true }

[tool.poetry.extras]
a2a = ["a2a-sdk"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
opentelemetry-sdk = ">=1.26.0"
opentelemetry-exporter-otlp-proto-http = ">=1.26.0"
a2a-sdk = { version = ">=0.2.4,<2", extras = ["grpc"] }

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/a2a"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/a2a/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
