[tool.poetry]
name = "traceAI-mcp-use"
version = "0.1.0"
description = "OpenTelemetry tracing for mcp-use agents: one span per agent run, LLM call and tool call"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
packages = [
    { include = "traceai_mcp_use" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: System :: Monitoring",
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "mcp-use"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fi-instrumentation-otel = ">=1.1.0"
mcp-use = ">=1.7.1,<2"
langchain-core = ">=1.0.0,<2"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/mcp-use"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/mcp-use/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
