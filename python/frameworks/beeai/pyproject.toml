[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceai-beeai"
version = "0.1.0"
description = "OpenTelemetry instrumentation for IBM BeeAI Framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "FutureAGI", email = "support@futureagi.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
]
keywords = ["traceai", "beeai", "ibm", "agents", "observability", "opentelemetry", "openinference", "tracing", "llm", "ai", "futureagi"]

dependencies = [
    "fi-instrumentation-otel>=0.1.11",
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-exporter-otlp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
beeai = [
    "beeai-framework>=0.1.0",
    "openinference-instrumentation-beeai>=0.1.0",
]

[project.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/beeai"
Changelog = "https://github.com/future-agi/traceAI/releases"
Issues = "https://github.com/future-agi/traceAI/issues"

[tool.hatch.build.targets.wheel]
packages = ["traceai_beeai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
