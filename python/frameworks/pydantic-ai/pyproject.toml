[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceai-pydantic-ai"
version = "0.1.0"
description = "OpenTelemetry instrumentation for Pydantic AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "FutureAGI", email = "support@futureagi.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
]
keywords = ["pydantic-ai", "opentelemetry", "tracing", "observability", "llm", "agents", "traceai", "futureagi"]

dependencies = [
    "fi-instrumentation-otel>=1.2.2",
    "pydantic-ai-slim>=1.0.0",
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-instrumentation>=0.40b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0.0",
]

[project.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/pydantic-ai"
Changelog = "https://github.com/future-agi/traceAI/releases"
Issues = "https://github.com/future-agi/traceAI/issues"

[tool.hatch.build.targets.wheel]
packages = ["traceai_pydantic_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require pydantic-ai and API keys)",
]
