[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "traceAI-agentscope"
version = "0.1.0"
description = "Future AGI adapter for AgentScope native OpenTelemetry tracing"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Future AGI", email = "no-reply@futureagi.com"}]
requires-python = ">=3.11,<3.14"
dependencies = [
  "agentscope>=2.0.10,<2.1",
  "fi-instrumentation-otel>=1.2.2,<2",
  "opentelemetry-sdk>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1.2,<2", "hatchling>=1.27,<2", "mypy>=1.15,<2"]

[project.urls]
Repository = "https://github.com/future-agi/traceAI"
Documentation = "https://docs.futureagi.com/docs/integrations/frameworks/agentscope"

[tool.hatch.build.targets.wheel]
packages = ["traceai_agentscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
