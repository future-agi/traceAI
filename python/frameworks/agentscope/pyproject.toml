[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceAI-agentscope"
version = "0.1.0"
description = "OpenTelemetry instrumentation for AgentScope"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "FutureAGI", email = "support@futureagi.com" }]
dependencies = [
    "agentscope>=1.0.21,<3",
    "fi-instrumentation-otel>=1.2.1",
    "opentelemetry-instrumentation>=0.50b0",
    "wrapt>=1.15,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "traceAI-openai>=0.1.10",
]

[project.entry-points.opentelemetry_instrumentor]
agentscope = "traceai_agentscope:AgentScopeInstrumentor"

[project.urls]
Homepage = "https://github.com/future-agi/traceAI"
Repository = "https://github.com/future-agi/traceAI"

[tool.hatch.build.targets.wheel]
packages = ["traceai_agentscope"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
