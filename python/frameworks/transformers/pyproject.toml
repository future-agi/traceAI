[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "traceAI-transformers"
version = "0.1.0"
description = "OpenTelemetry instrumentation for local Hugging Face Transformers pipelines"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Future AGI", email = "no-reply@futureagi.com"}]
requires-python = ">=3.10,<3.14"
dependencies = [
  "fi-instrumentation-otel>=1.2.2,<2",
  "transformers>=4.42,<6",
  "opentelemetry-instrumentation>=0.50b0,<1",
  "wrapt>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "torch>=2.6,<3", "traceAI-huggingface>=0.1.0", "mypy>=1.15,<2"]

[project.urls]
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/transformers"
Documentation = "https://docs.futureagi.com/docs/tracing"

[project.entry-points.opentelemetry_instrumentor]
transformers = "traceai_transformers:TransformersInstrumentor"

[tool.hatch.build.targets.wheel]
packages = ["traceai_transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
