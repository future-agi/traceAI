[tool.poetry]
name = "traceAI-livekit"
version = "0.1.3"
description = "OpenTelemetry instrumentation for LiveKit"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
packages = [
    { include = "traceai_livekit" }
]

[tool.poetry.dependencies]
python = ">3.9,<3.14"
fi-instrumentation-otel = ">=1.1.0"

[tool.poetry.group.dev.dependencies]
# livekit-agents 1.8 is the version whose privacy filter the tests cover; it needs Python 3.10+.
livekit-agents = { version = "~1.8", python = ">=3.10" }
livekit-plugins-openai = { version = "~1.8", python = ">=3.10" }
livekit-plugins-silero = { version = "~1.8", python = ">=3.10" }
python-dotenv = "*"
pytest = ">=7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
