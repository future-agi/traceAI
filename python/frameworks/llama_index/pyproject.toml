[tool.poetry]
name = "traceAI-llamaindex"
version = "0.1.9"
description = "OpenTelemetry instrumentation for LlamaIndex"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_llamaindex" },
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "llama-index"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">3.9, <3.14"
fi-instrumentation-otel = ">=0.1.11"
llama-index-core = ">=0.10.43"


[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/llamaindex"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/llama_index"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/llama_index/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
