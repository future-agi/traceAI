[tool.poetry]
name = "traceAI-tavily"
version = "0.1.0"
description = "OpenTelemetry instrumentation for the Tavily Python client"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
packages = [
    { include = "traceai_tavily" }
]
keywords = ["opentelemetry", "tavily", "search", "tracing", "observability", "traceai", "futureagi", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: System :: Monitoring",
]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fi-instrumentation-otel = ">=1.1.0"
tavily-python = ">=0.8.4,<1"
wrapt = ">=1.15.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/tracing"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/tavily"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/tavily/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
