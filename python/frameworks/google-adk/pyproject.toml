[tool.poetry]
name = "traceAI-google-adk"
version = "0.1.6"
description = "OpenTelemetry instrumentation for Google ADK"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_google_adk" },
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "google-adk"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">3.9, <3.13"
google-adk =  ">= 1.2.1"
google-genai = "^1.0.0"
fi-instrumentation-otel = ">=0.1.14"


[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/google_adk"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/google-adk"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/google-adk/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
