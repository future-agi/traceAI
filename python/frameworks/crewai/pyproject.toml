[tool.poetry]
name = "traceAI-crewai"
version = "0.1.10"
description = "OpenTelemetry instrumentation for CrewAI"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_crewai" },
]
license = "Apache-2.0"
keywords = ["traceai", "futureagi", "opentelemetry", "tracing", "observability", "llm", "crewai"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[tool.poetry.dependencies]
python = ">=3.10, <3.13"
crewai = ">=0.41.1"
fi-instrumentation-otel = ">=1.2.2"
# CrewAI 0.41.1 imports pkg_resources, removed in setuptools 81.
setuptools = ">=78.1.1,<81"


[tool.poetry.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/crewai"
Repository = "https://github.com/future-agi/traceAI/tree/dev/python/frameworks/crewai"
Changelog = "https://github.com/future-agi/traceAI/blob/dev/python/frameworks/crewai/CHANGELOG.md"
Issues = "https://github.com/future-agi/traceAI/issues"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
