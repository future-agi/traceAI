[tool.poetry]
name = "traceAI-crewai"
version = "0.1.9"
description = "OpenTelemetry instrumentation for Crewai"
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"

packages = [
    { include = "traceai_crewai" },
]

[tool.poetry.dependencies]
python = ">=3.10, <3.13"
crewai = ">=0.41.1"
fi-instrumentation-otel = ">=1.2.2"
# CrewAI 0.41.1 imports pkg_resources, removed in setuptools 81.
setuptools = ">=78.1.1,<81"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
