[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "traceai-cognee"
version = "0.1.0"
description = "Future AGI exporter for Cognee native OpenTelemetry spans"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Future AGI", email = "no-reply@futureagi.com"}]
requires-python = ">=3.10,<3.14"
dependencies = ["fi-instrumentation-otel>=1.2.2,<2", "opentelemetry-sdk>=1.27,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/future-agi/traceAI"
Documentation = "https://docs.futureagi.com/docs/integrations/traceai/cognee"

[tool.hatch.build.targets.wheel]
packages = ["traceai_cognee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
